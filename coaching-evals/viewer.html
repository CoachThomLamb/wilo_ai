<!doctype html>
<!-- Coaching evals: read traces.jsonl, write free-text notes per chat and per message.
     Run serve.py; notes save to notes.json in this folder. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coaching Evals</title>
<style>
  :root { --bg:#fafaf9; --panel:#fff; --fg:#1c1917; --mut:#78716c; --line:#e7e5e4; --user:#eef2ff; --tool:#f5f5f4; --wilo:#065f46; --wilobg:#d1fae5; --sel:#e0e7ff; --note:#fefce8; --noteline:#eab308; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0c0a09; --panel:#1c1917; --fg:#e7e5e4; --mut:#a8a29e; --line:#292524; --user:#1e1b4b; --tool:#292524; --wilo:#6ee7b7; --wilobg:#064e3b; --sel:#312e81; --note:#2a2410; --noteline:#a16207; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:12px; align-items:center; padding:8px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header .mut, small { color:var(--mut); font-size:12px; }
  main { flex:1; display:flex; min-height:0; }
  #list { width:300px; overflow:auto; border-right:1px solid var(--line); background:var(--panel); }
  #list div { padding:8px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  #list div.sel { background:var(--sel); }
  #list small { display:block; }
  .pie { display:inline-block; width:12px; height:12px; border-radius:50%; border:1.5px solid var(--fg); margin-right:6px; vertical-align:-1px; }
  #view { flex:1; overflow:auto; padding:16px; }
  .wrap { max-width:860px; }
  .meta { font-size:12px; color:var(--mut); margin-bottom:12px; }
  .msg { margin:0 0 4px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; white-space:pre-wrap; word-wrap:break-word; background:var(--panel); }
  .user { background:var(--user); margin-left:60px; }
  .role { font-size:11px; color:var(--mut); text-transform:uppercase; letter-spacing:.04em; display:flex; justify-content:space-between; }
  .role .when { text-transform:none; letter-spacing:0; }
  details { background:var(--tool); border-radius:6px; padding:4px 8px; margin:6px 0 0; white-space:normal; }
  summary { cursor:pointer; font-family:ui-monospace, monospace; font-size:12px; }
  pre { margin:6px 0 0; font-size:12px; white-space:pre-wrap; }
  .w { color:var(--wilo); background:var(--wilobg); border-radius:4px; padding:0 4px; font-family:ui-monospace, monospace; }
  textarea { width:100%; font:inherit; padding:8px; border:1px solid var(--noteline); border-radius:6px; background:var(--note); color:var(--fg); resize:vertical; }
  .chatnote { margin-bottom:16px; }
  .msgnote { margin:0 0 14px; display:flex; gap:8px; align-items:flex-start; }
  .msgnote textarea { flex:1; }
  .rate { display:flex; gap:4px; align-items:center; flex-wrap:wrap; max-width:170px; }
  .rate .dim { font-size:11px; color:var(--mut); width:56px; }
  .rate button { font-size:16px; padding:2px 8px; border:1px solid var(--line); border-radius:6px; background:var(--panel); cursor:pointer; opacity:.45; }
  .rate button.on { opacity:1; }
  .rate button.on.up { border-color:#16a34a; background:#dcfce7; }
  .rate button.on.down { border-color:#dc2626; background:#fee2e2; }
  .rate button.on.organic { border-color:#65a30d; background:#ecfccb; }
  .msg + .msg { margin-top:10px; }
  .empty { color:var(--mut); padding:40px; text-align:center; }
  #status.err { color:#b91c1c; }
  .msg.focus { outline:2px solid var(--noteline); }
  .msg { cursor:pointer; }
  #wo { width:380px; overflow:auto; border-left:1px solid var(--line); background:var(--panel); padding:12px; font-size:13px; }
  #wo .tabs { display:flex; gap:4px; margin-bottom:8px; }
  #wo .tabs button { flex:1; padding:4px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); cursor:pointer; }
  #wo .tabs button.on { background:var(--sel); font-weight:600; }
  #wo select { width:100%; margin-bottom:8px; }
  #wo h4 { margin:4px 0; }
  #wo .ex { border:1px solid var(--line); border-radius:8px; padding:6px 8px; margin-bottom:6px; }
  #wo .ex b { display:block; }
  #wo .cue { color:var(--mut); font-size:12px; }
  #wo table { border-collapse:collapse; width:100%; margin-top:4px; font-size:12px; }
  #wo td, #wo th { border-top:1px solid var(--line); padding:2px 4px; text-align:left; }
  #wo th { color:var(--mut); font-weight:500; }
  #wo .done { color:#22c55e; font-weight:700; font-size:14px; }
  #wo tr.isdone td { background:rgba(34, 197, 94, .14); }
  #wo .wnote { background:var(--note); border-radius:6px; padding:4px 8px; margin:4px 0; font-size:12px; }
  @media (max-width: 1000px) { main { flex-direction:column; } #list { width:auto; max-height:25vh; border-right:0; border-bottom:1px solid var(--line); } #wo { width:auto; max-height:35vh; border-left:0; border-top:1px solid var(--line); } .user { margin-left:16px; } }
</style>
</head>
<body>
<header>
  <b>Coaching evals</b>
  <label><input type="checkbox" id="onlyCoaching" checked> coaching only</label>
  <span id="count" class="mut"></span>
  <span id="status" class="mut"></span>
  <span class="mut">Alt+← / Alt+→ step chats</span>
</header>
<main>
  <div id="list"></div>
  <div id="view"><div class="empty">Loading…</div></div>
  <aside id="wo"></aside>
</main>
<script>
let chats = [], shown = [], cur = -1, notes = {}, timer = null;
let completed = [], focus = -1, woMode = 'planned', woPick = null;   // workout panel state
const isWilo = n => /wilo|coaching_method|assign_workout|update_workout|recent_|exercise_|get_profile|update_profile|workout_schema|get_workout|todo/i.test(n);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tools = c => c.messages.flatMap(m => (m.tool_calls || []).map(t => t.name));
// "Fri, Oct 9, 6:39 AM" in local time. Only Claude Code messages carry created_at; the claude.ai export has no per-message times.
const when = iso => new Date(iso).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const noted = c => { const n = notes[c.id]; return n && (n.chat || Object.keys(n.messages || {}).length); };
const status = (t, err) => { const s = document.getElementById('status'); s.textContent = t; s.className = err ? 'err' : 'mut'; };

async function boot() {
  try {
    const [t, n] = await Promise.all([fetch('traces.jsonl').then(r => r.text()), fetch('notes.json').then(r => r.json())]);
    chats = t.split('\n').filter(l => l.trim()).map(l => JSON.parse(l)).sort((a, b) => (a.updated_at || '').localeCompare(b.updated_at || ''));
    notes = n || {};
    completed = await fetch('completed.json').then(r => r.ok ? r.json() : []).catch(() => []);
    render();
  } catch (e) {
    document.getElementById('view').innerHTML = `<div class="empty">Couldn't load (${esc(e.message)}). Run <code>python3 coaching-evals/serve.py</code> and open the URL it prints.</div>`;
  }
}

// Debounced save of the whole notes object; empty notes are dropped so the file stays clean.
function save() {
  clearTimeout(timer);
  status('…');
  timer = setTimeout(async () => {
    for (const [id, n] of Object.entries(notes)) {
      for (const [k, m] of Object.entries(n.messages || {})) if (!m.coaching && !m.tools && !m.organic && !m.note?.trim()) delete n.messages[k];
      if (!n.chat?.trim() && !Object.keys(n.messages || {}).length) delete notes[id];
    }
    try {
      const r = await fetch('notes.json', { method: 'PUT', body: JSON.stringify(notes) });
      if (!r.ok) throw new Error(await r.text());
      status('saved ' + new Date().toLocaleTimeString());
      updateList();
    } catch (e) { status('save failed: ' + e.message, true); }
  }, 600);
}

function render() {
  const only = document.getElementById('onlyCoaching').checked;
  shown = chats.filter(c => !only || /coaching/.test(c.label || 'coaching'));
  updateList();
  show(shown.length ? Math.max(0, Math.min(cur, shown.length - 1)) : -1);
}

// Share of assistant replies with a note or a coaching/tools rating.
function coverage(c) {
  const ms = notes[c.id]?.messages || {};
  const ks = c.messages.map((m, k) => m.role === 'assistant' ? k : -1).filter(k => k >= 0);
  const done = ks.filter(k => ms[k] && (ms[k].coaching || ms[k].tools || ms[k].note?.trim())).length;
  return { done, total: ks.length, p: ks.length ? done / ks.length : 0 };
}
const pie = ({ done, total, p }) => `<span class="pie" title="${done}/${total} replies reviewed" style="background:conic-gradient(var(--fg) ${Math.round(p * 360)}deg, transparent 0)"></span>`;

function updateList() {
  document.getElementById('list').innerHTML = shown.map((c, i) =>
    `<div data-i="${i}" class="${i === cur ? 'sel' : ''}">${pie(coverage(c))}${noted(c) ? '✎ ' : ''}${esc(c.title || '(untitled)')}<small>${esc((c.updated_at || '').slice(0, 10))} · ${c.messages.length} msgs · ${esc(c.label || '')} · ${esc(c.source || '')}</small></div>`
  ).join('') || '<div class="empty">No chats.</div>';
  document.getElementById('count').textContent = `${shown.filter(noted).length}/${shown.length} with notes`;
}

function show(i) {
  cur = i;
  updateList();
  const v = document.getElementById('view');
  if (i < 0) { v.innerHTML = '<div class="empty">Nothing to show.</div>'; return; }
  const c = shown[i], n = notes[c.id] || { messages: {} };
  const order = tools(c).map(t => isWilo(t) ? `<span class="w">${esc(t)}</span>` : esc(t)).join(' → ') || 'no tool calls';
  v.innerHTML = `<div class="wrap"><h3 style="margin:0">${esc(c.title)}</h3>
    <div class="meta">${esc((c.updated_at || '').replace('T', ' ').slice(0, 16))} · ${esc(c.source || '')}${/^https?:/.test(c.url || '') ? ` · <a href="${esc(c.url)}" target="_blank" rel="noopener">open in claude.ai</a>` : ''}<br>Tools: ${order}${c.note ? `<br>Claude's label: <b>${esc(c.label)}</b> [${esc((c.tags || []).join(', '))}] ${esc(c.note)}` : ''}</div>
    <div class="chatnote"><textarea id="chatNote" rows="4" placeholder="Your notes on this chat">${esc(n.chat || '')}</textarea></div>` +
    c.messages.map((m, k) => `<div class="msg ${esc(m.role)}" data-mk="${k}"><div class="role"><span>${esc(m.role)} #${k}</span>${m.created_at ? `<span class="when">${esc(when(m.created_at))}</span>` : ''}</div>${esc(m.content)}${
      (m.tool_calls || []).map(t => `<details><summary>${isWilo(t.name) ? `<span class="w">${esc(t.name)}</span>` : esc(t.name)}</summary><pre>${esc(JSON.stringify(t.args, null, 2))}</pre></details>`).join('')
    }</div>${m.role === 'assistant' ? msgNote(k, n.messages?.[k] || {}) : ''}`).join('') + '</div>';
  v.scrollTop = 0;
  document.querySelector('#list .sel')?.scrollIntoView({ block: 'nearest' });
  woPick = null;
  setFocus(c.messages.length - 1);
}

// ---- workout panel ---------------------------------------------------
// Planned = the workout as the coach's assign/update calls left it up to the focused
// message. Full exercises in Claude Code traces; the claude.ai export only kept a
// one-line-per-exercise summary and notes ("same as draft").
function planned(c, k) {
  let w = null;
  c.messages.slice(0, k + 1).forEach((m, j) => (m.tool_calls || []).forEach(t => {
    const a = t.args?.workout;
    if (!/assign_workout|update_workout/.test(t.name) || !a) return;
    if (a.exercises || a.exercises_summary || !w) {
      w = { id: a.id ?? w?.id, name: a.name ?? w?.name, assignedFor: a.assignedFor ?? w?.assignedFor,
            exercises: a.exercises, summary: a.exercises_summary, notes: [] };
    } else {
      if (a.assignedFor) w.assignedFor = a.assignedFor;
      if (a.name) w.name = a.name;
    }
    for (const [key, val] of Object.entries(a)) {
      if (!['id', 'name', 'assignedFor', 'exercises', 'exercises_summary'].includes(key))
        w.notes.push(`#${j} ${key}: ${typeof val === 'string' ? val : JSON.stringify(val)}`);
    }
    Object.assign(w, { at: j, tool: t.name.replace(/^wilo:/, ''), saved: t.args.write === true });
  }));
  return w;
}

// Completed: same workout id (first finish on/after its date); else one finished the same
// day as the chat, closest in time (mid-workout chats finish after); else the last before.
function completedFor(c, w) {
  const same = completed.filter(x => w?.id && x.id === w.id);
  if (same.length) return same.find(x => x.finishedAt >= (w.assignedFor || '')) || same.at(-1);
  const at = Date.parse(c.updated_at), day = (c.updated_at || '').slice(0, 10);
  const sameDay = completed.filter(x => (x.finishedAt || '').startsWith(day))
    .sort((a, b) => Math.abs(Date.parse(a.finishedAt) - at) - Math.abs(Date.parse(b.finishedAt) - at));
  return sameDay.at(0) || completed.filter(x => x.finishedAt <= (c.updated_at || '9')).at(-1) || null;
}

const exTable = (exs, showDone) => exs.map(ex => `<div class="ex"><b>${esc(ex.name)}</b>${ex.cue ? `<div class="cue">${esc(ex.cue)}</div>` : ''}${ex.note ? `<div class="cue">note: ${esc(ex.note)}</div>` : ''}
  <table><tr><th>#</th><th>${ex.timed ? 'secs' : 'reps'}</th><th>lbs</th>${ex.custom_name ? `<th>${esc(ex.custom_name)}</th>` : ''}${showDone ? '<th></th>' : ''}</tr>${
    (ex.sets || []).map((s, i) => `<tr class="${showDone && s.done ? 'isdone' : ''}"><td>${i + 1}</td><td>${esc(s.reps)}</td><td>${esc(s.lbs)}</td>${ex.custom_name ? `<td>${esc(s.custom ?? '')}</td>` : ''}${showDone ? `<td class="done">${s.done ? '✓' : ''}</td>` : ''}</tr>`).join('')
  }</table></div>`).join('');

function renderWo() {
  const el = document.getElementById('wo'), c = shown[cur];
  if (!c) { el.innerHTML = ''; return; }
  const w = planned(c, focus), auto = completedFor(c, w);
  const done = completed.find(x => x.docId === (woPick ?? auto?.docId));
  const tabs = `<div class="tabs"><button data-mode="planned" class="${woMode === 'planned' ? 'on' : ''}">Planned @ #${focus}</button><button data-mode="completed" class="${woMode === 'completed' ? 'on' : ''}">Completed</button></div>`;
  let body;
  if (woMode === 'planned') {
    body = !w ? '<div class="cue">No workout planned in this chat up to this message.</div>'
      : `<h4>${esc(w.name || w.id || '(unnamed)')}</h4><div class="cue">${esc(w.id || '')} · for ${esc((w.assignedFor || '?').slice(0, 10))} · ${esc(w.tool)} #${w.at} · ${w.saved ? 'saved' : 'draft'}</div>` +
        w.notes.map(n => `<div class="wnote">${esc(n)}</div>`).join('') +
        (w.exercises ? exTable(w.exercises, false)
          : w.summary ? `<ol>${w.summary.map(s => `<li>${esc(s)}</li>`).join('')}</ol><div class="cue">claude.ai export: summary only</div>`
          : '<div class="cue">No exercise list in this call (see notes).</div>');
  } else {
    body = `<select id="woPick">${completed.slice().reverse().map(x => `<option value="${esc(x.docId)}" ${x === done ? 'selected' : ''}>${esc((x.finishedAt || '').slice(0, 16).replace('T', ' '))} · ${esc(x.name || x.id)}</option>`).join('')}</select>` +
      (!done ? '<div class="cue">No completed workout matched.</div>'
        : `<h4>${esc(done.name || done.id)}</h4><div class="cue">finished ${esc((done.finishedAt || '').slice(0, 16).replace('T', ' '))}${done === auto && woPick == null ? (w?.id === done.id ? ' · matched by id' : ' · matched by date') : ' · picked'}</div>` + exTable(done.exercises || [], true));
  }
  el.innerHTML = tabs + body;
}

function setFocus(k) {
  focus = k;
  document.querySelectorAll('.msg[data-mk]').forEach(d => d.classList.toggle('focus', +d.dataset.mk === k));
  renderWo();
}

// Every assistant reply: two separate thumbs (coaching quality, tools/product), organic flag, note.
const thumbs = (k, m, dim, label) => `<span class="dim">${label}</span>${
  ['up', 'down'].map(r => `<button data-k="${k}" data-dim="${dim}" data-r="${r}" class="${m[dim] === r ? 'on ' + r : ''}">${r === 'up' ? '👍' : '👎'}</button>`).join('')}`;
const msgNote = (k, m) => `<div class="msgnote"><div class="rate">${thumbs(k, m, 'coaching', 'Coaching')}${thumbs(k, m, 'tools', 'Tools')
}<button data-k="${k}" data-o="1" class="${m.organic ? 'on organic' : ''}" title="Organic: real coaching, not a test">🌱</button></div><textarea data-k="${k}" rows="2" placeholder="Note on reply #${k}">${esc(m.note || '')}</textarea></div>`;
const msgEntry = k => { const n = entry(); n.messages ||= {}; return (n.messages[k] ||= {}); };
const entry = () => (notes[shown[cur].id] ||= { chat: '', messages: {} });

document.getElementById('onlyCoaching').onchange = render;
document.getElementById('list').onclick = e => { const d = e.target.closest('div[data-i]'); if (d) show(+d.dataset.i); };
document.getElementById('view').addEventListener('input', e => {
  if (e.target.id === 'chatNote') entry().chat = e.target.value;
  else if (e.target.dataset.k) msgEntry(e.target.dataset.k).note = e.target.value;
  else return;
  save();
});
document.getElementById('view').addEventListener('click', e => {
  const o = e.target.closest('button[data-o]');
  if (o) {
    const m = msgEntry(o.dataset.k);
    m.organic = !m.organic || undefined;   // tap again to clear
    o.className = m.organic ? 'on organic' : '';
    save();
    return;
  }
  const b = e.target.closest('button[data-r]');
  if (!b) return;
  const m = msgEntry(b.dataset.k), dim = b.dataset.dim;
  m[dim] = m[dim] === b.dataset.r ? undefined : b.dataset.r;   // tap again to clear
  b.parentElement.querySelectorAll(`button[data-dim="${dim}"]`).forEach(x => x.className = m[dim] === x.dataset.r ? 'on ' + x.dataset.r : '');
  save();
});
document.getElementById('view').addEventListener('click', e => {
  if (e.target.closest('button, textarea, details, a')) return;
  const m = e.target.closest('.msg[data-mk]');
  if (m) setFocus(+m.dataset.mk);
});
document.getElementById('wo').addEventListener('click', e => {
  const b = e.target.closest('button[data-mode]');
  if (b) { woMode = b.dataset.mode; renderWo(); }
});
document.getElementById('wo').addEventListener('change', e => {
  if (e.target.id === 'woPick') { woPick = e.target.value; renderWo(); }
});
document.addEventListener('keydown', e => {
  if (!e.altKey || !shown.length) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); show(Math.min(cur + 1, shown.length - 1)); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); show(Math.max(cur - 1, 0)); }
});
boot();
</script>
</body>
</html>

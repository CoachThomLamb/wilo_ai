[project]
name = "wilo"
version = "0.1.0"
description = "WILO: workout data in Firestore, exposed to Claude as an MCP server."
requires-python = ">=3.12"
dependencies = [
    "firebase-admin",
    "jsonschema",
    "mcp",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wilo"]

<!doctype html>
<!-- Admin viewer (#127): pick a user, step through their workouts. Read-only; run serve.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WILO Admin Viewer</title>
<style>
  :root { --bg:#fafaf9; --panel:#fff; --fg:#1c1917; --mut:#78716c; --line:#e7e5e4; --sel:#e0e7ff; --tool:#f5f5f4; --note:#fefce8; --ok:#16a34a; --okbg:rgba(34,197,94,.14); --plan:#1d4ed8; --prog:#b45309; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0c0a09; --panel:#1c1917; --fg:#e7e5e4; --mut:#a8a29e; --line:#292524; --sel:#312e81; --tool:#292524; --note:#2a2410; --ok:#4ade80; --okbg:rgba(34,197,94,.18); --plan:#93c5fd; --prog:#fbbf24; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:12px; align-items:center; padding:8px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .mut, small { color:var(--mut); font-size:12px; }
  main { flex:1; display:flex; min-height:0; }
  .pane { overflow:auto; border-right:1px solid var(--line); background:var(--panel); }
  #users { width:230px; } #list { width:300px; }
  .pane div.row { padding:8px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .pane div.row.sel { background:var(--sel); }
  .pane small { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #view { flex:1; overflow:auto; padding:16px; }
  .wrap { max-width:820px; }
  h2 { margin:0 0 4px; font-size:20px; }
  .meta { font-size:12px; color:var(--mut); margin-bottom:14px; }
  .chip { display:inline-block; font-size:11px; padding:0 6px; border-radius:4px; border:1px solid var(--line); margin-right:4px; }
  .chip.planned { color:var(--plan); border-color:var(--plan); }
  .chip.progress { color:var(--prog); border-color:var(--prog); }
  .chip.done { color:var(--ok); border-color:var(--ok); }
  .ex { border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin-bottom:8px; background:var(--panel); }
  .ex b { display:block; }
  .cue, .note { font-size:13px; border-radius:6px; padding:2px 8px; margin:4px 0; }
  .cue { background:var(--tool); } .note { background:var(--note); }
  table { border-collapse:collapse; width:100%; margin-top:4px; font-size:13px; font-variant-numeric:tabular-nums; }
  td, th { border-top:1px solid var(--line); padding:2px 6px; text-align:left; }
  th { color:var(--mut); font-weight:500; }
  tr.isdone td { background:var(--okbg); }
  .tick { color:var(--ok); font-weight:700; }
  details { margin-top:16px; } summary { cursor:pointer; color:var(--mut); font-size:12px; }
  pre { font-size:12px; white-space:pre-wrap; background:var(--tool); border-radius:6px; padding:8px; }
  .empty { color:var(--mut); padding:40px; text-align:center; }
  .err { color:#dc2626; }
  @media (max-width: 900px) { main { flex-direction:column; } .pane { width:auto !important; max-height:22vh; border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <b>WILO admin viewer</b>
  <span class="mut">read-only</span>
  <span id="status" class="mut"></span>
  <span class="mut">Alt+↑/↓ step workouts</span>
</header>
<main>
  <div id="users" class="pane"><div class="empty">Loading…</div></div>
  <div id="list" class="pane"></div>
  <div id="view"><div class="empty">Pick a user.</div></div>
</main>
<script>
let users = [], workouts = [], uidSel = null, cur = -1;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const day = s => s ? String(s).slice(0, 16).replace('T', ' ') : '';

async function get(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// planned / in progress / done, from the fields each collection has today.
function status(w) {
  if (w.status) return w.status;
  if (w.collection === 'assigned') return 'planned';
  return w.inProgress ? 'in progress' : 'done';
}
const chip = s => `<span class="chip ${s === 'in progress' ? 'progress' : s}">${esc(s)}</span>`;

async function boot() {
  try { users = await get('api/users'); }
  catch (e) { document.getElementById('users').innerHTML = `<div class="empty err">${esc(e.message)}</div>`; return; }
  document.getElementById('users').innerHTML = users.map((u, i) =>
    `<div class="row" data-i="${i}" onclick="pickUser(${i})"><b>${esc(u.name || u.email || u.uid)}</b>
     <small>${esc(u.email || '')}</small><small>${esc(u.uid)}</small></div>`).join('') || '<div class="empty">No users.</div>';
}

async function pickUser(i) {
  uidSel = users[i].uid;
  document.querySelectorAll('#users .row').forEach(r => r.classList.toggle('sel', +r.dataset.i === i));
  const st = document.getElementById('status');
  st.textContent = 'loading workouts…';
  try { workouts = await get('api/workouts?uid=' + encodeURIComponent(uidSel)); }
  catch (e) { st.innerHTML = `<span class="err">${esc(e.message)}</span>`; return; }
  st.textContent = `${workouts.length} workouts`;
  cur = -1;
  renderList();
  show(0);
}

function renderList() {
  document.getElementById('list').innerHTML = workouts.map((w, i) =>
    `<div class="row ${i === cur ? 'sel' : ''}" onclick="show(${i})">${chip(status(w))}<b style="display:inline">${esc(w.name || '(no name)')}</b>
     <small>${esc(day(w.finishedAt || w.assignedFor))} · ${esc(w.collection)}/${esc(w.docId)}</small></div>`).join('')
    || '<div class="empty">No workouts.</div>';
}

function show(i) {
  if (i < 0 || i >= workouts.length) return;
  cur = i;
  const w = workouts[i];
  const exs = (w.exercises || []).map(x => {
    const custom = x.custom_name ? `<th>${esc(x.custom_name)}</th>` : '';
    const rows = (x.sets || []).map((s, j) => `<tr class="${s.done ? 'isdone' : ''}"><td>${j + 1}</td>
      <td>${esc(s.reps)}${x.timed ? ' s' : ''}</td><td>${esc(s.lbs)}</td>${x.custom_name ? `<td>${esc(s.custom)}</td>` : ''}
      <td>${s.done ? '<span class="tick">✓</span>' : ''}</td></tr>`).join('');
    return `<div class="ex"><b>${esc(x.name)}</b>
      ${x.cue ? `<div class="cue">Coach: ${esc(x.cue)}</div>` : ''}${x.note ? `<div class="note">You: ${esc(x.note)}</div>` : ''}
      <table><tr><th>Set</th><th>${x.timed ? 'Secs' : 'Reps'}</th><th>Lbs</th>${custom}<th>Done</th></tr>${rows}</table></div>`;
  }).join('');
  document.getElementById('view').innerHTML = `<div class="wrap">
    <h2>${esc(w.name || '(no name)')}</h2>
    <div class="meta">${chip(status(w))} ${esc(w.collection)}/${esc(w.docId)}
      ${w.assignedFor ? ` · for ${esc(day(w.assignedFor))}` : ''}${w.finishedAt ? ` · finished ${esc(day(w.finishedAt))}` : ''}</div>
    ${exs || '<div class="mut">No exercise list.</div>'}
    <details><summary>Raw document</summary><pre>${esc(JSON.stringify(w, null, 2))}</pre></details></div>`;
  renderList();
  document.getElementById('view').scrollTop = 0;
}

document.addEventListener('keydown', e => {
  if (e.altKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); show(cur + (e.key === 'ArrowDown' ? 1 : -1)); }
});
boot();
</script>
</body>
</html>

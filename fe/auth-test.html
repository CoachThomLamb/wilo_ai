<!DOCTYPE html>
<!--
  Auth smoke test for fe/auth.js. Not linked from the app.

  - Sign in with Google, show uid/email.
  - Write users/{uid}/test/ping and read it back, which exercises both the
    users/{uid} provision write and the users/{uid}/** security rule.
  - All results go to the on-screen log (phone has no devtools).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WILO auth test</title>
<style>
  body {
    background: #000; color: #f2f2f7; margin: 0; padding: 16px;
    font: 400 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  button {
    display: block; width: 100%; margin: 0 0 10px; padding: 14px;
    border: 0; border-radius: 10px; background: #0a84ff; color: #fff; font: inherit;
  }
  button:disabled { background: #262628; color: #7c7c82; }
  #who { margin: 0 0 16px; color: #7c7c82; word-break: break-all; }
  #log { font: 13px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; }
  .err { color: #ff453a; }
  .ok { color: #34c759; }
</style>
</head>
<body>
<h2>WILO auth test</h2>
<p id="who">Loading…</p>
<button id="signin" disabled>Sign in with Google</button>
<button id="ping" disabled>Write + read test doc</button>
<button id="signout" disabled>Sign out</button>
<div id="log"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

  const $ = id => document.getElementById(id);
  const log = (msg, cls) => {
    const line = document.createElement("div");
    line.textContent = `${new Date().toLocaleTimeString()}  ${msg}`;
    if (cls) line.className = cls;
    $("log").prepend(line);
  };
  window.onerror = (m) => log(m, "err");
  window.onunhandledrejection = e => log(e.reason?.code || e.reason?.message || String(e.reason), "err");

  initializeApp({
    apiKey: "AIzaSyDQ-MDgxaD6vab2awYKuez3vLB-Tmj6oLM",
    authDomain: "wilo2-1ee44.firebaseapp.com",
    projectId: "wilo2-1ee44",
    storageBucket: "wilo2-1ee44.firebasestorage.app",
    messagingSenderId: "103580826325",
    appId: "1:103580826325:web:0e5cc800c5cbb29691c05c"
  });
  // Dynamic import: auth.js calls getApp() at load, so the app must exist first.
  const { signIn, signOut, onUser, userDoc } = await import("./auth.js");

  log(`host ${location.host}${navigator.standalone ? " (home-screen app)" : ""}`);

  onUser(user => {
    $("who").textContent = user ? `${user.email}\nuid: ${user.uid}` : "Signed out";
    $("signin").disabled = !!user;
    $("ping").disabled = !user;
    $("signout").disabled = !user;
    log(user ? `signed in as ${user.email}` : "no user");
  });

  $("signin").onclick = async () => {
    try {
      const user = await signIn();
      if (user) log("sign-in + users/{uid} provision ok", "ok");
      else log("redirecting to Google…");
    } catch (e) {
      log(`sign-in failed: ${e.code || e.message}`, "err");
    }
  };

  $("ping").onclick = async () => {
    try {
      const ref = userDoc("test", "ping");
      await setDoc(ref, { at: serverTimestamp(), ua: navigator.userAgent });
      const snap = await getDoc(ref);
      log(`wrote + read ${ref.path}: ${snap.exists() ? "ok" : "missing"}`, snap.exists() ? "ok" : "err");
    } catch (e) {
      log(`ping failed: ${e.code || e.message}`, "err");
    }
  };

  $("signout").onclick = () => signOut();
</script>
</body>
</html>

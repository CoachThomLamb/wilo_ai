<!DOCTYPE html>
<!--
  WILO workout tracker — per-user, flat exercise list.

  - Sign-in required (Google, via auth.js). Signed out, a gate covers the
    app. All data is users/{uid}/...; no top-level collections (#15).
  - Boot: restores the draft; once signed in, a listener on
    users/{uid}/workouts (#126) loads the next workout: the earliest by
    assignedFor that isn't done, unless a draft is in progress.
  - Timeline: ‹ › under the header step through every workout by day: done
    ones back in time, planned ones ahead. Every day is the normal tracker:
    log sets on whichever one is on screen. Leaving a day saves its logged
    sets first. If the coach changes the workout on screen, the listener
    merges the new plan in by itself: logged sets, renames, deletions and
    your own exercises stay, the rest comes from the new plan (#68, #145).
    The timeline is live: no refetching, no Update bar.
  - Log: sets/reps/lbs per exercise; timed exercises (dead hang) log secs.
    Optional custom_name per exercise adds a 4th column for free-form data.
  - Swap: exercises with a `fallback` get a button to switch to the easier
    variant; swap again to restore. Logged values on the original survive
    a swap round-trip (captured by reference).
  - Persistence: draft autosaves to localStorage ("Draft saved"). Finish
    saves the log to the workout doc, users/{uid}/workouts/{id}, with
    status "done"; "Saved ✓" and a "Workout complete" screen only after
    Firestore confirms, else "Save failed — retry". Only the log, logBase,
    status and timestamps are written: the plan is the coach's (#126).
    A workout logged with no plan gets its own doc on the first save
    (id kept per workout, so retries never duplicate).
    Save as you go: once a set is ticked, changes also save quietly to that
    doc with status "in progress" ("Synced to WILO"), so the coach sees them
    mid-workout (#68).

  Coach chat: the Coach button opens chat.js's sheet, which talks to the
  connector server's /chat (wilo/chat.py).

  Error surface: thrown errors go to window.onerror -> note() -> the
  on-screen status line. The line holds errors for 8s so autosave ticks
  don't overwrite them. (Phone has no devtools, so the status line is
  the only diagnostic.)
-->

<html lang="en">
<head>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getFirestore, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
  // authDomain = this page's own host on Firebase Hosting (live and PR
  // previews serve /__/auth/handler). Otherwise redirect sign-in breaks in
  // Safari's in-app browsers (Camera, Claude app): the handler on another
  // domain loses its state ("missing initial state"). Each host must be an
  // Authorized redirect URI (https://<host>/__/auth/handler) on the OAuth
  // web client in Google Cloud. Elsewhere (localhost) use the default.
  const onHosting = /\.web\.app$|\.firebaseapp\.com$/.test(location.hostname);
  const app = initializeApp({
    apiKey: "AIzaSyDQ-MDgxaD6vab2awYKuez3vLB-Tmj6oLM",
    authDomain: onHosting ? location.host : "wilo2-1ee44.firebaseapp.com",
    projectId: "wilo2-1ee44",
    storageBucket: "wilo2-1ee44.firebasestorage.app",
    messagingSenderId: "103580826325",
    appId: "1:103580826325:web:0e5cc800c5cbb29691c05c"
  });
  getFirestore(app, "wilo");
  // Only per-user paths: every read and write goes through auth.js's
  // userCol / userDoc (users/{uid}/...). No top-level collection access.
  window.__setDoc = setDoc;
  window.__updateDoc = updateDoc;
  window.__onSnapshot = onSnapshot;
  // auth.js calls getApp() at load, so import it after initializeApp.
  import("./auth.js")
    .then(a => a.onUser(user =>
      window.dispatchEvent(new CustomEvent("wilo-user", { detail: user }))))
    .catch(err => window.dispatchEvent(new CustomEvent("wilo-auth-error", { detail: err })));
</script>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="WILO">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta charset="utf-8">
<title>WILO</title>
<style>
  :root {
    --bg: #000;
    --panel: #0e0e0f;
    --field: #1c1c1e;
    --line: #262628;
    --text: #f2f2f7;
    --dim: #7c7c82;
    --accent: #0a84ff;
    --done: #1f4a2c;
    --done-line: #34c759;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; width: 100%; max-width: 100%; overflow-x: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font: 400 17px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
    position: fixed; top: 0; left: 0; right: 0;
    height: 100dvh;
    height: var(--vvh, 100dvh);
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--line); flex: none;
  }
.saved { margin: 2px 0 0; font-size: 12px; color: var(--dim); }
  .saved.ok { color: var(--done-line); }
  .finish {
    background: var(--accent); color: #fff; border: 0;
    padding: 8px 20px; border-radius: 999px; font-size: 16px; font-weight: 500;
  }

  .hbtns { display: flex; align-items: center; gap: 8px; }
  .who { background: none; border: 0; padding: 4px 0 0; color: var(--accent); font-family: inherit; font-size: 12px; }
  .ghost {
    background: var(--field); color: var(--text); border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 999px; font-family: inherit; font-size: 15px;
  }
  .swap {
    background: none; border: 1px solid var(--line); border-radius: 999px;
    color: var(--dim); font-family: inherit; font-size: 13px; padding: 5px 12px;
    margin-top: 10px;
  }
  /* exercise videos and photos (#152) */
  .ex-media { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .ex-media:empty { display: none; }
  .demo-slot:empty { display: none; }
  .chip {
    background: none; border: 1px solid var(--line); border-radius: 999px;
    color: var(--dim); font-family: inherit; font-size: 13px; padding: 5px 12px;
  }
  .chip.demo { color: var(--accent); border-color: var(--accent); }
  .chip.coach { border-style: dashed; }
  .chip:disabled { opacity: .6; }
  .media-view {
    position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.94);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .media-view video, .media-view img { max-width: 100%; max-height: 100%; border-radius: 12px; }
  .media-close {
    position: absolute; top: max(12px, env(safe-area-inset-top)); right: 16px; background: none; border: 0;
    color: #fff; font-size: 34px; line-height: 1; padding: 4px 8px;
  }
  .swap.on { color: var(--done-line); border-color: var(--done-line); }
  /* sign-in gate: covers the app until a user is signed in */
  .gate {
    position: fixed; inset: 0; z-index: 10; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 24px; text-align: center;
  }
  .gate[hidden] { display: none; }
  .gate h1 { margin: 0; font-size: 34px; }
  .gate p { margin: 0; color: var(--dim); font-size: 15px; }
  .saved.err { color: #ff453a; }
  /* "Workout complete" screen after a confirmed save */
  .done-screen { background: rgba(0,0,0,.92); }
  .done-screen .big { font-size: 64px; line-height: 1; }
  .done-screen .stat { color: var(--text); font-size: 20px; font-weight: 600; }
  /* scrolling exercise list */
  .list { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: 90px; }

  .exercise { padding: 18px 16px 10px; border-bottom: 1px solid var(--line); }
  .exercise, .ex-head { min-width: 0; max-width: 100%; }
  .ex-head { display: flex; align-items: flex-start; gap: 8px; }
  .ex-name {
    flex: 1 1 auto; min-width: 0; background: transparent; border: 0; padding: 0 0 4px;
    color: var(--accent); font-family: inherit; font-size: 20px; font-weight: 600; line-height: 1.25;
  }
  .ex-note {
    display: block; width: 100%; min-width: 0; max-width: 100%;
    background: transparent; border: 0; padding: 0 0 14px;
    color: #b5b5bd; font-family: inherit; font-size: 16px; font-weight: 400; line-height: 1.3;
  }
  .ex-cue { color: #b5b5bd; font-size: 15px; line-height: 1.35; padding: 0 0 8px; white-space: pre-wrap; }
  .ex-cue::before { content: 'Coach: '; color: var(--accent); }
  .ex-name:focus, .ex-note:focus { outline: none; box-shadow: 0 1px 0 var(--accent); }
  .sess-name-input {
    background: transparent; border: 0; padding: 0; width: 100%;
    color: inherit; font-family: inherit; font-size: 28px; font-weight: 700; line-height: 1.2;
  }
  .sess-name-input:focus { outline: none; box-shadow: 0 1px 0 var(--accent); }
  .ex-name::placeholder { color: #2d5c8a; }
  .ex-note::placeholder { color: #7c7c82; }
  .kill {
    background: none; border: 0; color: var(--dim);
    font-size: 20px; line-height: 1; padding: 2px 4px;
  }

  table { width: 100%; max-width: 480px; border-collapse: collapse; table-layout: fixed; }
  th { color: var(--dim); font-size: 13px; font-weight: 500; padding-bottom: 10px; text-align: center; }
  td { padding: 4px 0; text-align: center; }
  td:first-child { text-align: left; }

  .setno {
    width: 34px; height: 34px; margin: 0 auto; background: var(--field);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 600;
  }

  input[type=number], input[type=text] {
    width: 72px; height: 38px; background: var(--field); border: 0; border-radius: 8px;
    color: var(--text); font-family: inherit; font-size: 17px; font-weight: 500; text-align: center;
    appearance: textfield; -moz-appearance: textfield;
  }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .check { width: 44px; height: 36px; border: 0; border-radius: 8px; background: var(--field); color: var(--dim); font-size: 17px; }
  tr.done .check { background: var(--done); color: var(--done-line); }
  tr.done input[type=number], tr.done input[type=text] { background: var(--done); }

  .add, .add-ex {
    width: 100%; padding: 13px; background: var(--field); border: 0;
    border-radius: 10px; color: var(--text); font-family: inherit; font-size: 16px; font-weight: 400;
  }
  .add { margin-top: 14px; }
  .add-ex-wrap { padding: 18px 16px; }
  .add-ex { width: 100%; color: var(--accent); }

  /* #136: Train / Review */
  .who.mode-link { color: var(--accent); border: 0; background: none; padding: 0 0 0 10px; font-size: inherit; }
  body.train .tl { display: none; }
  .whoa { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 24px; }
  .whoa[hidden] { display: none; }
  .whoa .box { background: var(--card, #1e1e1e); border: 1px solid var(--line); border-radius: 14px; padding: 22px; max-width: 340px; text-align: center; }
  .whoa h3 { margin: 0 0 8px; font-size: 22px; }
  .whoa p { margin: 0 0 18px; color: var(--dim); font-size: 16px; }
  .whoa button { width: 100%; height: 46px; border-radius: 10px; border: 0; background: var(--accent); color: #000; font-weight: 700; font-size: 16px; font-family: inherit; }
  .no-today { padding: 48px 16px; text-align: center; color: var(--dim); font-size: 18px; }

  /* timeline: ‹ day › under the header */
  .tl { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex: none; }
  .tl-step {
    flex: none; width: 48px; height: 40px; background: var(--field); border: 1px solid var(--line);
    border-radius: 10px; color: var(--text); font-family: inherit; font-size: 26px; line-height: 1; padding: 0 0 3px;
  }
  .tl-step:disabled { opacity: .25; }
  .tl-mid {
    flex: 1; min-width: 0; background: none; border: 0; color: var(--text); font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .tl-mid strong { font-size: 16px; font-weight: 600; }
  .tl-mid span { font-size: 12px; color: var(--dim); }

  /* JSON sheet */
  .json-btn {
    position: fixed; right: 16px; bottom: 20px; z-index: 3;
    background: var(--field); border: 1px solid var(--line); color: var(--text);
    padding: 11px 18px; border-radius: 999px;
    font: 500 15px ui-monospace, SFMono-Regular, Menlo, monospace;
    box-shadow: 0 4px 16px rgba(0,0,0,.6);
  }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
    background: var(--panel); border-top: 1px solid var(--line);
    height: 55vh; display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform .28s cubic-bezier(.3,.8,.4,1);
  }
  .sheet.open { transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line); flex: none;
  }
  .sheet-head span { font-size: 13px; color: var(--dim); }
  .sheet-head .last { color: var(--accent); font-family: ui-monospace, Menlo, monospace; }
  .sheet-head button { background: none; border: 0; color: var(--accent); font-family: inherit; font-size: 16px; }
  pre {
    flex: 1; overflow: auto; margin: 0; padding: 12px 16px;
    font: 400 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #a8d5ff; white-space: pre-wrap;
  }
  /* coach chat (chat.js): full-height sheet that shrinks with the keyboard (--vvh) */
  .chat-btn {
    position: fixed; left: 16px; bottom: 20px; z-index: 3;
    background: var(--accent); border: 0; color: #fff;
    padding: 11px 18px; border-radius: 999px; font-family: inherit; font-size: 15px; font-weight: 500;
    box-shadow: 0 4px 16px rgba(0,0,0,.6);
  }
  .chat-sheet {
    position: fixed; left: 0; right: 0; top: 0; z-index: 5; height: var(--vvh, 100dvh);
    background: var(--bg); display: flex; flex-direction: column;
    transform: translateY(100%); visibility: hidden;
    transition: transform .28s cubic-bezier(.3,.8,.4,1), visibility 0s linear .28s;
  }
  .chat-sheet.open { transform: translateY(0); visibility: visible; transition: transform .28s cubic-bezier(.3,.8,.4,1); }
  @media (prefers-reduced-motion: reduce) { .chat-sheet, .chat-sheet.open { transition: none; } }
  .chat-sheet .sheet-head { padding-top: max(12px, env(safe-area-inset-top)); }
  .chat-sheet .sheet-head strong { font-size: 17px; }
  .chat-log {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; }
  .msg.me { align-self: flex-end; background: var(--accent); color: #fff; }
  .msg.coach { align-self: flex-start; background: var(--field); }
  .msg.pending { color: var(--dim); }
  .msg.err { align-self: flex-start; background: none; border: 1px solid #ff453a; color: #ff453a; }
  .msg.hint { align-self: center; max-width: 100%; color: var(--dim); font-size: 14px; text-align: center; }
  .msg.note { align-self: flex-start; padding-top: 0; color: var(--dim); font-size: 14px; }
  /* hold to copy (chat.js): no word selection or callout on touch screens; held = about to copy */
  .msg { position: relative; transition: transform .15s, filter .15s; }
  @media (hover: none) { .msg { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; } }
  .msg.held { transform: scale(.97); filter: brightness(1.25); }
  .msg.flash::after {
    content: attr(data-flash); position: absolute; top: -10px; right: 8px;
    background: var(--text); color: var(--bg); font-size: 12px; font-weight: 600;
    padding: 2px 8px; border-radius: 999px; pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) { .msg { transition: none; } }
  .chat-form {
    display: flex; gap: 8px; align-items: flex-end; flex: none;
    padding: 10px 16px max(10px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line);
  }
  .chat-form textarea {
    flex: 1; min-width: 0; resize: none; height: 44px; max-height: 120px;
    background: var(--field); border: 0; border-radius: 20px; padding: 11px 14px;
    color: var(--text); font-family: inherit; font-size: 16px; line-height: 1.3;
  }
  .chat-form textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chat-form .finish:disabled { opacity: .5; }
</style>
</head>
<body class="train">

<div class="gate" id="gate">
  <h1>WILO</h1>
  <p id="gateMsg">Checking sign-in…</p>
  <button class="finish" id="gateBtn" hidden>Sign in with Google</button>
</div>

<div class="gate done-screen" id="doneScreen" hidden>
  <div class="big">💪</div>
  <h1>Workout complete</h1>
  <p class="stat" id="doneStat"></p>
  <p>Saved. Your coach will see it next time you talk.</p>
  <button class="finish" id="doneBtn">I'm awesome</button>
  <a class="ghost" href="today.html" style="text-decoration:none">Back to Today</a>
</div>

<header>
  <div>
    <div style="font-size:11px;color:#4caf50;margin-bottom:4px;">v2026-11-06-media</div>
    <input id="sessName" class="sess-name-input" value="WILO">
    <p class="saved" id="saved">Not saved yet</p>
    <button class="who" id="authBtn" hidden>Sign in</button>
    <a class="who" href="today.html" style="text-decoration:none">Today →</a>
    <button class="who mode-link" id="modeLink">Review →</button>
  </div>
  <div class="hbtns">
    <button class="ghost" id="resetBtn">Reset</button>
    <button class="finish" id="finish">Finish</button>
  </div>
</header>

<nav class="tl" aria-label="Workouts by day">
  <button class="tl-step" id="tlPrev" aria-label="Earlier workout">&lsaquo;</button>
  <div class="tl-mid"><strong id="tlDay">Today</strong><span id="tlWhat"></span></div>
  <button class="tl-step" id="tlNext" aria-label="Later workout">&rsaquo;</button>
</nav>

<div class="whoa" id="whoa" hidden><div class="box"><h3>Whoa 🛑</h3><p>Focus on your training — we'll review later. Go get those gains!</p><button id="whoaOk">Back to training</button></div></div>
<div class="no-today" id="noToday" hidden>No workout today</div>
<div class="list" id="list"></div>

<button class="json-btn" id="jsonBtn">{ }</button>
<button class="chat-btn" id="chatBtn">Coach</button>

<div class="chat-sheet" id="chatSheet" role="dialog" aria-label="Coach chat">
  <div class="sheet-head">
    <button id="chatNew">New</button>
    <strong>Coach</strong>
    <button id="chatClose">Close</button>
  </div>
  <div class="chat-log" id="chatLog" aria-live="polite"></div>
  <form class="chat-form" id="chatForm">
    <textarea id="chatInput" rows="1" placeholder="Message your coach" enterkeyhint="send"></textarea>
    <button class="finish" type="submit">Send</button>
  </form>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-head">
    <span class="last" id="last">state</span>
    <button id="closeSheet">Close</button>
  </div>
  <pre id="state"></pre>
</div>

<script>
  let nextId = 1;
  const uid = () => 'ex' + (nextId++) + '-' + Math.random().toString(36).slice(2, 7);
  // Exercises you add get u-... ids; the coach's get x1, x2, ... from the server.
  const userExId = () => 'u-' + Math.random().toString(36).slice(2, 8);

  // The workout doc on screen, as last read from users/{uid}/workouts ({docId, ...data}).
  let loadedWorkout = null;

  // ---- program -> logging state -------------------------------------
  function makeExercise(def) {
    const timed = !!(def.target && def.target.duration_sec);
    const defaultLbs = def.start_weight_lbs || 0;
    const defaultReps = timed ? (def.target.duration_sec[0])
                               : (def.target && def.target.reps ? def.target.reps : 10);
    // def.sets can be a number (program) or an array of logged sets (export)
    const sets = Array.isArray(def.sets)
      ? def.sets.map(s => ({ lbs: s.lbs ?? defaultLbs, reps: s.reps ?? defaultReps, done: s.done ?? false, custom: s.custom || null }))
      : Array.from({ length: def.sets || 1 }, () => ({ lbs: defaultLbs, reps: defaultReps, done: false, custom: null }));

    const exId = def.exId || userExId();

    return {
      instanceId: def.exId || def.instanceId || uid(),
      exId,
      timed,
      name: def.name,
      custom_name: def.custom_name || null,
      cue: def.cue || '',     // the coach's instructions (#100), shown read-only
      note: def.note || '',   // the user's own note
      fallback: def.fallback || null,
      swapped: def.swapped || false,
      original: def.original || null,
      removed: !!def.removed,
      media: def.media || [],   // your form videos/photos (#152): [{key, type, at}]
      sets
    };
  }

  // w: a doc from users/{uid}/workouts, plus its docId (#126).
  // fresh: start from the plan even if the doc has a log (Reset).
  function loadWorkout(w, fresh = false) {
    if (!w || !w.docId) throw new Error('invalid workout');
    loadedWorkout = w;
    state.docId = w.docId;
    state.finished = w.status === 'done';
    state.finishedAt = state.finished ? w.finishedAt || null : null;
    state.workoutId = w.id || null;
    state.workoutName = w.name;
    // Picking up a workout started on another phone: carry on from its log.
    const log = !fresh && (w.log || []).length ? w.log : null;
    state.logBase = log ? w.logBase || 0 : (w.diffs || []).length;
    state.exercises = (log || w.exercises || []).map(makeExercise);
    // The coach changed the plan since this log last saw it: merge it in now.
    if (log && !state.finished && (w.diffs || []).length > state.logBase) {
      state.exercises = mergePlan(state.exercises, w.exercises || []);
      state.logBase = w.diffs.length;
    }
    document.getElementById('sessName').value = w.name || 'WILO';
  }

  // Mid-workout plan change (#68): the coach changed the workout you're on.
  // Every logged (done) set is kept as logged; the sets still to do come from
  // the new plan. Exercises match by exId, which never changes, so a rename
  // doesn't break the match (#109, #145); your rename stays unless this change
  // renamed it (prevPlan: the plan before the change). One you deleted stays
  // deleted; one you added stays, at the end. A started exercise the new plan
  // dropped keeps its logged sets, first. The plan's own done flags are
  // ignored, so a set is never counted twice.
  function mergePlan(current, planDefs, prevPlan = []) {
    const used = new Set();
    const merged = planDefs.map(def => {
      const fresh = makeExercise(def);
      fresh.sets.forEach(s => { s.done = false; });
      const old = current.find(x => !used.has(x) && x.exId === fresh.exId);
      if (!old) return fresh;
      used.add(old);
      const logged = old.sets.filter(s => s.done);
      const before = prevPlan.find(p => p.exId === fresh.exId);
      const name = before && before.name !== fresh.name ? fresh.name : old.name;
      // The coach's plan sets the cue; your note and your deletion stay (#100).
      return { ...fresh, instanceId: old.instanceId, name, note: old.note || fresh.note, removed: old.removed,
               media: old.media || [], sets: [...logged, ...fresh.sets.slice(logged.length)] };
    });
    const rest = current.filter(x => !used.has(x));
    const dropped = rest.filter(x => !x.exId.startsWith('u-') && !x.removed && x.sets.some(s => s.done))
      .map(x => ({ ...x, sets: x.sets.filter(s => s.done) }));
    const added = rest.filter(x => x.exId.startsWith('u-'));
    return [...dropped, ...merged, ...added];
  }

  // Same workout, new plan from the coach: merge it into what you've logged.
  function mergeWorkout(w, prev) {
    loadedWorkout = w;
    state.workoutName = w.name || state.workoutName;
    state.logBase = (w.diffs || []).length;
    state.exercises = mergePlan(state.exercises, w.exercises || [], (prev && prev.exercises) || []);
    document.getElementById('sessName').value = state.workoutName || 'WILO';
  }

  // Exercise videos (#152). media.demos: exercise name -> {key, type, url} (or null: none), asked once per name.
  const media = { coach: false, demos: {}, asked: false };
  const state = { docId: null, logBase: 0, workoutId: null, workoutName: '', finished: false, finishedAt: null, exercises: [] };

  const list = document.getElementById('list');
  const sheet = document.getElementById('sheet');
  let last = 'state';

  // Draws the workout in the tracker: whichever day is on screen is the one you log.
  function draw() {
    rebuild();
    sessName.value = state.workoutName || 'WILO';
    drawDraft();
  }

  function drawDraft() {
    list.innerHTML = '';
    state.exercises.filter(ex => !ex.removed).forEach(ex => {
      const unit = ex.timed ? 'secs' : 'reps';
      const el = document.createElement('div');
      el.className = 'exercise';
      el.innerHTML = `
        <div class="ex-head">
          <input class="ex-name" value="${esc(ex.name)}" placeholder="Exercise name"
                 data-id="${ex.instanceId}" data-k="name">
          <button class="kill" data-kill="${ex.instanceId}">&times;</button>
        </div>
        ${ex.cue ? `<div class="ex-cue">${esc(ex.cue)}</div>` : ''}
        <input class="ex-note" value="${esc(ex.note)}" placeholder="Add note"
               data-id="${ex.instanceId}" data-k="note">
        <input class="ex-note" value="${esc(ex.custom_name || '')}" placeholder="Custom field name (e.g. incline height)"
               data-id="${ex.instanceId}" data-k="custom_name">
        <table>
          <thead><tr><th>Set</th>${ex.timed ? '' : '<th>lbs</th>'}<th>${unit}</th>${ex.custom_name ? `<th>${esc(ex.custom_name)}</th>` : ''}<th>&check;</th></tr></thead>
          <tbody>${ex.sets.map((s, i) => `
            <tr class="${s.done ? 'done' : ''}">
              <td><div class="setno">${i + 1}</div></td>
              ${ex.timed ? '' : `<td><input type="number" inputmode="numeric" value="${s.lbs}" data-id="${ex.instanceId}" data-i="${i}" data-k="lbs"></td>`}
              <td><input type="number" inputmode="numeric" value="${s.reps}" data-id="${ex.instanceId}" data-i="${i}" data-k="reps"></td>
              ${ex.custom_name ? `<td><input type="text" value="${esc(s.custom || '')}" data-id="${ex.instanceId}" data-i="${i}" data-k="custom"></td>` : ''}
              <td><button class="check" data-id="${ex.instanceId}" data-i="${i}">&check;</button></td>
            </tr>`).join('')}</tbody>
        </table>
        <button class="add" data-add="${ex.instanceId}">+ Add Set</button>
        <div class="ex-media">
          <span class="demo-slot" data-demo-name="${esc(ex.name)}"></span>
          ${(ex.media || []).map((m, i) => `<button class="chip" data-view="${ex.instanceId}" data-mi="${i}">${m.type === 'video' ? '▶ Video' : '▣ Photo'} ${i + 1}</button>`).join('')}
          <button class="chip" data-upload="form" data-ex="${ex.instanceId}">+ Video / photo</button>
          ${media.coach && ex.name ? `<button class="chip coach" data-upload="demo" data-ex="${ex.instanceId}">Upload demo</button>` : ''}
        </div>
        ${ex.fallback || ex.swapped
          ? `<button class="swap ${ex.swapped ? 'on' : ''}" data-swap="${ex.instanceId}">${ex.swapped ? '\u21a9 Back to full range' : '\u21c4 Swap to easier version'}</button>`
          : ''}`;
      list.appendChild(el);
    });
    const wrap = document.createElement('div');
    wrap.className = 'add-ex-wrap';
    wrap.innerHTML = '<button class="add-ex" id="addEx">+ Add Exercise</button>';
    list.appendChild(wrap);
    sync();
    showDemos();
  }

  // ---- exercise videos and photos (#152, fe/media.js) ------------------
  const picker = Object.assign(document.createElement('input'), { type: 'file', accept: 'video/*,image/*', hidden: true });
  document.body.appendChild(picker);

  function fillDemos() {
    list.querySelectorAll('.demo-slot').forEach(slot => {
      const d = media.demos[slot.dataset.demoName];
      slot.innerHTML = d ? `<button class="chip demo" data-demo="${esc(slot.dataset.demoName)}">▶ Coach demo</button>` : '';
    });
  }

  async function showDemos() {
    fillDemos();
    const names = [...new Set(state.exercises.map(x => x.name).filter(n => n && !(n in media.demos)))];
    if (!window.__media || !window.__auth || !window.__auth.currentUser() || (!names.length && media.asked)) return;
    try {
      const out = await window.__media.urls({ demos: names });
      names.forEach(n => { media.demos[n] = out.demos[n] || null; });
      if (out.coach !== media.coach) { media.coach = out.coach; media.asked = true; return drawDraft(); }
      media.asked = true;
      fillDemos();
    } catch (err) { console.warn('demos:', err.message); }
  }

  let pending = null;   // {kind, ex} the picker is choosing a file for
  picker.addEventListener('change', async () => {
    const file = picker.files[0], job = pending;
    picker.value = '';
    if (!file || !job) return;
    const btn = list.querySelector(`[data-upload="${job.kind}"][data-ex="${job.ex.instanceId}"]`);
    if (btn) { btn.disabled = true; btn.textContent = 'Uploading…'; }
    try {
      const up = await window.__media.upload(file, { kind: job.kind, docId: state.docId || 'draft', exId: job.ex.exId, exercise: job.ex.name });
      if (job.kind === 'demo') {
        delete media.demos[job.ex.name];
        last = `${job.ex.name}: demo uploaded`;
      } else {
        job.ex.media = [...(job.ex.media || []), { key: up.key, type: up.type, at: new Date().toISOString() }];
        last = `${job.ex.name}.media += ${up.type}`;
      }
      drawDraft();   // saves the log, so the coach can see the new video
    } catch (err) {
      if (btn) { btn.disabled = false; btn.textContent = 'Try again'; }
      note(err.message, 'err');
    }
  });

  async function openMedia(key, type) {
    try {
      const out = await window.__media.urls({ keys: [key] });
      if (out.urls[key]) window.__media.show(out.urls[key], type);
    } catch (err) { note(err.message, 'err'); }
  }

  list.addEventListener('click', e => {
    const up = e.target.closest('[data-upload]');
    if (up) {
      const ex = state.exercises.find(x => x.instanceId === up.dataset.ex);
      if (!ex || !window.__media) return;
      pending = { kind: up.dataset.upload, ex };
      return picker.click();
    }
    const view = e.target.closest('[data-view]');
    if (view) {
      const ex = state.exercises.find(x => x.instanceId === view.dataset.view);
      const m = ex && ex.media[+view.dataset.mi];
      return m && openMedia(m.key, m.type);
    }
    const demo = e.target.closest('[data-demo]');
    if (demo) {
      const d = media.demos[demo.dataset.demo];
      return d && window.__media.show(d.url, d.type);
    }
  });

  function esc(s) { return String(s).replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

  function sync() {
    document.getElementById('state').textContent = JSON.stringify(state, null, 2);
    document.getElementById('last').textContent = last;
    drawNav();
    queueSave();
    queueCloudSave();
  }

  list.addEventListener('blur', e => {
    if (e.target.dataset.k === 'custom_name') draw();
  }, true);

  list.addEventListener('input', e => {
    const el = e.target;
    if (el.tagName !== 'INPUT') return;
    const id = el.dataset.id, k = el.dataset.k;
    const ex = state.exercises.find(x => x.instanceId === id);
    if (!ex) return;

    if (el.dataset.i !== undefined) {
      const i = +el.dataset.i;
      ex.sets[i][k] = k === 'custom' ? el.value : (el.value === '' ? 0 : +el.value);
      last = `${ex.name}.sets[${i}].${k} = ${ex.sets[i][k]}`;
      sync();
    } else {
      ex[k] = el.value;   // a rename keeps the exId, so the coach's changes still find it
      last = `${ex.name}.${k}`;
      sync();
    }
  });

  list.addEventListener('click', e => {
    const chk = e.target.closest('.check');
    if (chk) {
      const id = chk.dataset.id, i = +chk.dataset.i;
      const ex = state.exercises.find(x => x.instanceId === id);
      if (!ex) throw new Error('no exercise for id ' + id);
      const s = ex.sets[i];
      s.done = !s.done;
      chk.closest('tr').classList.toggle('done', s.done);
      last = `${ex.name}.sets[${i}].done = ${s.done}`;
      return sync();
    }
    const add = e.target.closest('[data-add]');
    if (add) {
      const id = add.dataset.add;
      const ex = state.exercises.find(x => x.instanceId === id);
      if (!ex) throw new Error('no exercise for id ' + id);
      const sets = ex.sets;
      const p = sets[sets.length - 1];
      sets.push({ lbs: p ? p.lbs : 45, reps: p ? p.reps : 5, done: false, custom: null });
      last = `${ex.name}.sets.push()`;
      return draw();
    }
    const sw = e.target.closest('[data-swap]');
    if (sw) {
      const id = sw.dataset.swap;
      const ex = state.exercises.find(x => x.instanceId === id);
      if (!ex) throw new Error('no exercise for id ' + id);
      if (!ex.swapped && ex.fallback) {
        ex.original = { name: ex.name, cue: ex.cue, sets: ex.sets };
        const f = ex.fallback;
        ex.name = f.name;
        ex.cue = f.cue || ex.cue;
        ex.sets = Array.from({ length: f.sets || ex.sets.length },
          () => ({ lbs: 0, reps: (f.target && f.target.reps) || 8, done: false, custom: null }));
        ex.swapped = true;
      } else if (ex.original) {
        Object.assign(ex, ex.original);
        ex.swapped = false;
        ex.original = null;
      }
      last = `${ex.name}.swapped = ${ex.swapped}`;
      return draw();
    }
    const kill = e.target.closest('[data-kill]');
    if (kill) {
      const id = kill.dataset.kill;
      const idx = state.exercises.findIndex(x => x.instanceId === id);
      if (idx < 0) throw new Error('no exercise for id ' + id);
      const gone = state.exercises[idx];
      // One from the plan is only hidden, so the coach's next change doesn't bring it back.
      if (gone.exId.startsWith('u-')) state.exercises.splice(idx, 1);
      else gone.removed = true;
      last = `${gone.name}.removed`;
      return draw();
    }
    if (e.target.id === 'addEx') {
      state.exercises.push({
        instanceId: uid(),
        exId: userExId(),
        timed: false,
        name: '',
        custom_name: null,
        cue: '',
        note: '',
        fallback: null,
        swapped: false,
        original: null,
        removed: false,
        sets: [{ lbs: 45, reps: 5, done: false, custom: null }]
      });
      last = `exercises.push() \u2192 ${state.exercises.length}`;
      draw();
      const inputs = list.querySelectorAll('.ex-name');
      inputs[inputs.length - 1].focus();
    }
  });

  document.getElementById('jsonBtn').addEventListener('click', () => sheet.classList.toggle('open'));
  document.getElementById('closeSheet').addEventListener('click', () => sheet.classList.remove('open'));

  // Lock the app to the visual viewport: the keyboard shrinks the scroll
  // area instead of displacing the whole layout.
  const vv = window.visualViewport;
  function lockViewport() {
    const h = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty('--vvh', h + 'px');
    window.scrollTo(0, 0);
  }
  if (vv) {
    vv.addEventListener('resize', lockViewport);
    vv.addEventListener('scroll', lockViewport);
  }
  window.addEventListener('resize', lockViewport);
  lockViewport();

  // iOS still nudges the document on focus; snap it back on the next frame.
  document.addEventListener('focusin', () => {
    requestAnimationFrame(() => { window.scrollTo(0, 0); lockViewport(); });
  });

  // ---- persistence -------------------------------------------------
  const KEY = 'workout-log-draft';
  const savedEl = document.getElementById('saved');

  // One place to surface a problem. The status line is already on screen,
  // which beats a console you can't open on a phone.
  // Errors hold the line for a few seconds. Without this the autosave tick
  // (400ms) overwrites the message with "Saved 3:57 PM" before it can be read.
  let noteUntil = 0;
  function note(msg, kind) {   // kind: 'ok' | 'err' | undefined
    savedEl.textContent = msg;
    savedEl.classList.toggle('ok', kind === 'ok');
    savedEl.classList.toggle('err', kind === 'err');
    noteUntil = Date.now() + 8000;
  }
  window.addEventListener('error', ev => {
    note('Error: ' + (ev.message || 'unknown') + (ev.lineno ? ' @' + ev.lineno : ''));
  });
  window.addEventListener('unhandledrejection', ev => {
    const r = ev.reason;
    note('Error: ' + (r && (r.name || r.message) ? (r.name || r.message) : r));
  });
  let saveTimer = null;

  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ savedAt: Date.now(), state }));
      if (Date.now() < noteUntil) return;   // don't stomp a visible message
      // "Draft", not "Saved": this is only this phone's browser, not Firestore.
      const t = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
      savedEl.textContent = 'Draft saved ' + t;
      savedEl.classList.remove('ok', 'err');
    } catch (err) {
      note("Couldn't save to this browser");
    }
  }

  function queueSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 400);
  }

  function restore() {
    let raw;
    try { raw = localStorage.getItem(KEY); } catch (err) { return; }
    if (!raw) return;
    try {
      const saved = JSON.parse(raw);
      if (!saved.state || !Array.isArray(saved.state.exercises)) return;
      state.exercises = saved.state.exercises;
      state.workoutId = saved.state.workoutId || null;
      state.workoutName = saved.state.workoutName || '';
      state.docId = saved.state.docId || null;   // a draft from before #126 has none: found by workoutId
      state.logBase = saved.state.logBase || 0;
      state.finished = !!saved.state.finished;
      state.finishedAt = saved.state.finishedAt || null;
      if (state.workoutName) document.getElementById('sessName').value = state.workoutName;
      state.exercises.forEach(ex => {
        if (!ex.instanceId) ex.instanceId = uid();
        if (!ex.exId) ex.exId = userExId();
        if (ex.timed === undefined) ex.timed = false;
        if (ex.swapped === undefined) ex.swapped = false;
      });
      const t = new Date(saved.savedAt).toLocaleString([], {
        month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
      });
      savedEl.textContent = 'Restored from ' + t;
      savedEl.classList.add('ok');
    } catch (err) { /* corrupt draft: start fresh */ }
  }

  const pad = n => String(n).padStart(2, '0');

  // The log: what you did, as this page shows it. Only this page writes it (#126).
  function buildLog() {
    return state.exercises.map(ex => ({
      exId: ex.exId,
      name: ex.name,
      cue: ex.cue || '',
      note: ex.note || '',
      custom_name: ex.custom_name || null,
      timed: ex.timed,
      swapped: ex.swapped,
      fallback: ex.fallback || null,
      removed: !!ex.removed,
      media: ex.media || [],
      sets: ex.sets.map(s => ({ lbs: s.lbs, reps: s.reps, done: s.done, custom: s.custom || null }))
    }));
  }

  // DD-mmm-HH:MM-slug-rand, e.g. 09-oct-06:30-chest-7qmb
  function makeDocId(stamp) {
    const month = stamp.toLocaleString('en-US', { month: 'short' }).toLowerCase();
    const nameSlug = (state.workoutName || 'workout').slice(0, 5).toLowerCase().replace(/\s+/g, '-');
    const rand = Math.random().toString(36).slice(2, 6);
    return `${pad(stamp.getDate())}-${month}-${pad(stamp.getHours())}:${pad(stamp.getMinutes())}-${nameSlug}-${rand}`;
  }

  // Saves the log to the workout doc and resolves only once Firestore confirms.
  // Only the log, status and timestamps: the plan is the coach's. A workout
  // logged with no plan gets its doc on the first save; the id is kept in state
  // (and the draft), so a retry or a second Finish never duplicates it.
  // Once finished, it keeps the time it was finished, so a later edit doesn't
  // make an old workout look like the latest one.
  async function saveWorkout(status, stamp) {
    const a = window.__auth;
    if (!a || !a.currentUser()) throw new Error('not signed in');
    const iso = stamp.toISOString();
    const fields = { log: buildLog(), logBase: state.logBase, status, updatedAt: iso };
    if (status === 'done') fields.finishedAt = state.finishedAt || iso;
    let create = false;   // this save has to create the doc
    if (state.docId) {
      try {
        await window.__updateDoc(a.userDoc('workouts', state.docId), fields);
      } catch (err) {
        if (err.code !== 'not-found') throw err;   // our own unplanned doc whose first save never landed
        create = true;
      }
    } else {
      state.docId = makeDocId(stamp);
      persist();
      create = true;
    }
    if (create) {
      const base = { id: state.workoutId || 'log_' + stamp.getTime(), name: state.workoutName || 'Workout',
        assignedFor: iso, createdAt: iso, plan: [], diffs: [], exercises: [] };
      await window.__setDoc(a.userDoc('workouts', state.docId), { ...base, ...fields });
    }
    return state.docId;
  }

  // Save as you go (#68): a couple of seconds after any change, quietly save the
  // logged sets to the same completed doc Finish uses, so the coach can see them
  // mid-workout. Only once a set is ticked; failures stay quiet (the draft has it).
  // After Finish it stays finished, so a later edit doesn't reopen the workout.
  // Nothing changed since the day was opened or last saved: nothing to save,
  // so stepping through old workouts doesn't rewrite them.
  let cloudTimer = null;
  let savedSig = null;
  const sig = () => JSON.stringify([state.workoutId, state.workoutName, state.exercises]);
  function queueCloudSave() {
    clearTimeout(cloudTimer);
    cloudTimer = setTimeout(async () => {
      const a = window.__auth;
      if (!state.workoutId || !a || !a.currentUser()) return;
      if (!state.exercises.some(x => x.sets.some(s => s.done))) return;
      const mark = sig();
      if (mark === savedSig) return;
      const stamp = new Date();
      try {
        await saveWorkout(state.finished ? 'done' : 'in progress', stamp);
        savedSig = mark;
        if (Date.now() < noteUntil) return;
        savedEl.textContent = 'Synced to WILO ' + stamp.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        savedEl.classList.remove('ok', 'err');
      } catch (err) { /* offline or signed out: the draft keeps it; Finish retries */ }
    }, 2000);
  }

  // Celebrates a confirmed save, with sets done vs. planned (the MVP metric).
  const doneScreen = document.getElementById('doneScreen');
  function showDone() {
    const sets = state.exercises.filter(x => !x.removed).flatMap(x => x.sets);
    const done = sets.filter(s => s.done).length;
    document.getElementById('doneStat').textContent =
      `${done} of ${sets.length} sets · ${state.workoutName || 'workout'}`;
    doneScreen.hidden = false;
  }
  document.getElementById('doneBtn').addEventListener('click', () => { doneScreen.hidden = true; });

  // "Saved ✓" only after Firestore confirms. On failure the draft stays in
  // this browser, so tapping Finish again retries (same doc id).
  document.getElementById('finish').addEventListener('click', async () => {
    persist();
    clearTimeout(cloudTimer);   // this save replaces any pending quiet one
    const stamp = new Date();
    note('Saving…');
    try {
      await saveWorkout('done', stamp);
      state.finished = true;
      state.finishedAt = state.finishedAt || stamp.toISOString();
      persist();
      draw();   // it's on the done side of the timeline now
      const t = stamp.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      note('Saved ✓ ' + t, 'ok');
      showDone();
    } catch (err) {
      if (err && err.message === 'not signed in') note('Not signed in — sign in, then tap Finish again', 'err');
      else note('Save failed (' + (err.code || err.message || err) + ') — tap Finish to retry', 'err');
    }
  });

  // ---- timeline: step through the stack -------------------------------
  // Every workout by day, from users/{uid}/workouts: done, or planned / in
  // progress. Past dates count, so a skipped workout still shows (#90). A
  // stop's day is its assignedFor, or the day it was finished if it has none.
  // The stop that matches the workout in the tracker is live: that's the one
  // on screen.
  let fetched = null;   // { plans: [{ docId, doc }], done: [{ docId, doc }] }
  let timeline = [];    // [{ kind: 'done' | 'plan' | 'draft', key, docId, doc, live }], oldest first
  let at = -1;          // index of the stop on screen

  // YYYY-MM-DD in local time; a plain date passes through.
  function dayOf(v) {
    if (!v) return '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
    const d = new Date(v);
    return isNaN(d) ? '' : `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  // Pure, tested in tests/fe/timeline_test.mjs. workouts: [{ docId, doc }] from
  // users/{uid}/workouts, one doc per workout (#126). draft: { docId, workoutId, key }.
  // Done (status 'done') or planned (planned / in progress). A stop's day is
  // its assignedFor, or the day it was finished if it has none.
  // The stop that is the draft gets live: true; if none is, a 'draft' stop is
  // added on the draft's day, so the editor is always on the timeline.
  function buildTimeline(workouts, draft) {
    // A draft from before #126 knows its workout only by id.
    const isDraft = s => draft.docId ? s.docId === draft.docId : !!draft.workoutId && s.doc.id === draft.workoutId;
    const stops = workouts.map(w => ({
      kind: w.doc.status === 'done' ? 'done' : 'plan',
      key: dayOf(w.doc.assignedFor || w.doc.finishedAt),
      docId: w.docId, doc: w.doc,
    })).map(s => ({ ...s, live: isDraft(s) }));
    const liveAt = stops.findIndex(s => s.live);
    stops.forEach((s, i) => { if (i !== liveAt) s.live = false; });
    if (liveAt < 0) stops.push({ kind: 'draft', key: draft.key || '', docId: null, doc: null, live: true });
    // Same day: done first (in the order finished), then the draft, then planned.
    const rank = { done: 0, draft: 1, plan: 2 };
    const fin = s => (s.doc && s.doc.finishedAt) || '';
    const cmp = (x, y) => x < y ? -1 : x > y ? 1 : 0;
    return stops.sort((x, y) => cmp(x.key, y.key) || rank[x.kind] - rank[y.kind] || cmp(fin(x), fin(y)));
  }

  // Rebuild from the last fetch and what's in the tracker now.
  function rebuild() {
    timeline = buildTimeline(fetched ? fetched.workouts : [], {
      docId: state.docId,
      workoutId: state.workoutId,
      key: dayOf((loadedWorkout && loadedWorkout.assignedFor) || new Date().toISOString()),
    });
    at = timeline.findIndex(s => s.live);
  }

  // Every change to the workouts lands here, kept current by a listener (#126):
  // the coach planning one, the coach changing the one you're on, or this
  // page's own saves. Only redraws the list when something on screen changed,
  // so a save doesn't wipe what you're typing.
  async function onWorkouts(snap) {
    fetched = { workouts: snap.docs.map(d => ({ docId: d.id, doc: d.data() })) };
    let redraw = false;
    // A draft from before #126 knows its workout only by id, and its exIds came
    // from the exercise names: take the plan's, so the coach's changes find them.
    if (!state.docId && state.workoutId) {
      const w = fetched.workouts.find(x => x.doc.id === state.workoutId);
      if (w) {
        state.docId = w.docId;
        state.logBase = (w.doc.diffs || []).length;
        const free = [...(w.doc.exercises || [])];
        state.exercises.forEach(ex => {
          const i = free.findIndex(p => p.name === ex.name);
          if (i >= 0) ex.exId = free.splice(i, 1)[0].exId;
        });
        persist();
      }
    }
    const cur = state.docId && fetched.workouts.find(w => w.docId === state.docId);
    if (cur) {
      const prev = loadedWorkout && loadedWorkout.docId === cur.docId ? loadedWorkout : null;
      loadedWorkout = { docId: cur.docId, ...cur.doc };
      if (!state.finished && (cur.doc.diffs || []).length > state.logBase) {
        const logged = state.exercises.flatMap(x => x.sets).filter(s => s.done).length;
        mergeWorkout(loadedWorkout, prev);
        last = 'coach changed ' + state.docId;
        redraw = true;
        note(`Coach updated the plan${logged ? `, kept ${logged} logged set${logged === 1 ? '' : 's'}` : ''}`, 'ok');
      }
    }
    rebuild();
    if (!state.exercises.length) {   // never replace sets in progress
      const next = timeline.find(s => s.kind === 'plan');
      if (next) {
        openStop(next);
        note('Loaded ' + (state.workoutName || next.docId));
      } else note('No workout planned — ask your coach to plan one');
      redraw = true;
    }
    // PROTOTYPE #136: Train opens on today's workout (once, at startup).
    if (mode === 'train' && !trainSynced && timeline.length) { trainSynced = true; await jumpToday(); redraw = true; }
    if (redraw || !firstSnap) draw(); else drawNav();
    firstSnap = true;
  }
  let firstSnap = false;

  let unlisten = null;
  function listen() {
    if (unlisten) unlisten();
    firstSnap = false;
    unlisten = window.__onSnapshot(window.__auth.userCol('workouts'),
      snap => onWorkouts(snap).catch(err => note('Error: ' + (err.code || err.message || err), 'err')),
      err => note("Couldn't load workouts: " + (err.code || err.message || err), 'err'));
  }

  // Put a day's workout in the tracker: its log if it has one (logged sets
  // come back), else its plan.
  function openStop(s) {
    if (s.kind === 'draft') return;
    loadWorkout({ docId: s.docId, ...s.doc });
    savedSig = sig();
  }

  // Before leaving a day: save its logged sets now (the quiet save, without
  // the wait). If that fails, stay, so nothing logged is left behind.
  async function saveBeforeLeaving() {
    clearTimeout(cloudTimer);
    if (sig() === savedSig || !state.exercises.some(x => x.sets.some(s => s.done))) return true;
    if (!state.workoutId) return confirm("This workout isn't from a plan, so it isn't saved to WILO. Leave it?");
    const stamp = new Date(), mark = sig();
    try {
      await saveWorkout(state.finished ? 'done' : 'in progress', stamp);
      savedSig = mark;
      return true;
    } catch (err) {
      note("Couldn't save this workout, so you're still on it (" + (err.code || err.message || err) + ')', 'err');
      return false;
    }
  }

  function dayLabel(key) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(key || '');
    if (!m) return 'No date';
    const d = new Date(+m[1], m[2] - 1, +m[3]);
    const t = new Date();
    const diff = Math.round((d - new Date(t.getFullYear(), t.getMonth(), t.getDate())) / 864e5);
    const word = { '-1': 'Yesterday', 0: 'Today', 1: 'Tomorrow' }[diff];
    const date = d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    return word ? `${word} · ${date}` : date;
  }

  const tlPrev = document.getElementById('tlPrev');
  const tlNext = document.getElementById('tlNext');
  function drawNav() {
    const s = timeline[at];
    tlPrev.disabled = at <= 0;
    tlNext.disabled = at < 0 || at >= timeline.length - 1;
    document.getElementById('tlDay').textContent = dayLabel(s ? s.key : dayOf(new Date().toISOString()));
    const logged = state.exercises.some(x => x.sets.some(x => x.done));
    document.getElementById('tlWhat').textContent =
      state.finished ? 'Done' : logged ? 'In progress' : s && s.kind === 'plan' ? 'Planned' : '';
    applyMode();
  }

  let moving = false;
  async function goTo(i) {
    if (moving || i < 0 || i >= timeline.length || i === at) return;
    moving = true;
    try {
      const s = timeline[i];
      if (!(await saveBeforeLeaving())) return;
      openStop(s);
      last = 'opened ' + (state.workoutId || s.docId);
      draw();
      list.scrollTop = 0;
    } finally { moving = false; }
  }
  tlPrev.addEventListener('click', () => goTo(at - 1));
  tlNext.addEventListener('click', () => goTo(at + 1));

  // ---- PROTOTYPE #136: Train / Review ---------------------------------
  // Train (default): today's workout only, no ‹ ›. Review: the ‹ › timeline.
  let mode = 'train', trainSynced = false;
  const todayKey = () => dayOf(new Date().toISOString());
  const todayIdx = () => timeline.findIndex(s => s.key === todayKey());
  const midWorkout = () => !state.finished && state.exercises.some(x => x.sets.some(s => s.done));
  async function jumpToday() {
    if (midWorkout()) return;   // you're training: stay on this workout
    const i = todayIdx();
    if (i >= 0) await goTo(i);
  }
  function applyMode() {
    document.body.classList.toggle('train', mode === 'train');
    document.getElementById('modeLink').innerHTML = (mode === 'train' ? 'Review →' : 'Train →');
    const empty = mode === 'train' && !!fetched && todayIdx() < 0 && !midWorkout();
    document.getElementById('noToday').hidden = !empty;
    list.style.display = empty ? 'none' : '';
  }
  async function setMode(m) {
    mode = m;
    applyMode();
    if (m === 'train') await jumpToday();
  }
  document.getElementById('modeLink').addEventListener('click', () => {
    if (mode === 'train' && midWorkout()) { document.getElementById('whoa').hidden = false; return; }
    setMode(mode === 'train' ? 'review' : 'train');
  });
  document.getElementById('whoaOk').addEventListener('click', () => { document.getElementById('whoa').hidden = true; });

  const sessName = document.getElementById('sessName');
  sessName.addEventListener('input', e => {
    state.workoutName = e.target.value;
  });

  // ---- sign-in -------------------------------------------------------
  // Required. Signed out, the gate covers the app; the draft stays in this
  // browser and is still there after signing in. All data is users/{uid}.
  const authBtn = document.getElementById('authBtn');
  const gate = document.getElementById('gate');
  const gateMsg = document.getElementById('gateMsg');
  const gateBtn = document.getElementById('gateBtn');
  let authSeen = false;

  window.addEventListener('wilo-user', ev => {
    const user = ev.detail;
    gate.hidden = !!user;
    gateBtn.hidden = !!user;
    gateMsg.textContent = 'Sign in to see your workouts.';
    authBtn.hidden = !user;
    if (user) authBtn.textContent = user.email + ' \u00b7 Sign out';
    // First event is just the restored session; don't clobber the status line.
    if (authSeen && user) note('Signed in as ' + user.email);
    authSeen = true;
    if (user) listen();
    else {   // no one else's workouts on the timeline
      if (unlisten) { unlisten(); unlisten = null; }
      fetched = null;
      draw();
    }
  });
  window.addEventListener('wilo-auth-error', ev => {
    gateMsg.textContent = "Couldn't load sign-in: " + (ev.detail && ev.detail.message || ev.detail) + '. Check your connection and reload.';
  });

  gateBtn.addEventListener('click', async () => {
    try { await window.__auth.signIn(); }
    catch (err) { gateMsg.textContent = 'Sign-in failed: ' + (err.code || err.message); }
  });
  authBtn.addEventListener('click', async () => {
    const a = window.__auth;
    if (!a || !a.currentUser()) return;
    if (confirm('Sign out of ' + a.currentUser().email + '? Your draft stays on this phone.')) await a.signOut();
  });

  // ---- reset ---------------------------------------------------------
  // Without this the only way to clear a stale draft is the Files app.
  // Resets to the workout currently loaded from Firestore.
  document.getElementById('resetBtn').addEventListener('click', () => {
    if (!loadedWorkout) { note('No workout loaded'); return; }
    const logged = state.exercises.flatMap(x => x.sets).filter(s => s.done).length;
    const msg = logged
      ? `Discard ${logged} logged set${logged === 1 ? '' : 's'} and start this workout over?`
      : 'Reset to the assigned workout?';
    if (!confirm(msg)) return;
    try { localStorage.removeItem(KEY); } catch {}
    loadWorkout(loadedWorkout);
    last = 'reset to ' + (state.workoutId || 'workout');
    draw();
    note('Reset to ' + (state.workoutName || 'assigned'));
  });

  // Boot: restore any saved draft. The next workout loads once sign-in
  // is known (the 'wilo-user' handler), and only if there's no draft.
  restore();
  draw();
</script>
<script type="module" src="./chat.js"></script>
<script type="module" src="./media.js"></script>

</body>
</html>

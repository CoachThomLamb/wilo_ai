<!DOCTYPE html>
<!--
  WILO workout tracker — single-user, flat exercise list.

  - Boot: loads the latest assigned workout from Firestore `assigned`
    (ordered by assignedFor desc). Load button re-runs the same query.
  - Log: sets/reps/lbs per exercise; timed exercises (dead hang) log secs.
    Optional custom_name per exercise adds a 4th column for free-form data.
  - Swap: exercises with a `fallback` get a button to switch to the easier
    variant; swap again to restore. Logged values on the original survive
    a swap round-trip (captured by reference).
  - Persistence: draft autosaves to localStorage; Finish downloads JSON
    and writes to Firestore `completed` with a DD-mmm-HH:MM-slug-rand doc id.

  Error surface: thrown errors go to window.onerror -> note() -> the
  on-screen status line. The line holds errors for 8s so autosave ticks
  don't overwrite them. (Phone has no devtools, so the status line is
  the only diagnostic.)
-->

<html lang="en">
<head>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getFirestore, doc, setDoc, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
  const app = initializeApp({
    apiKey: "AIzaSyDQ-MDgxaD6vab2awYKuez3vLB-Tmj6oLM",
    authDomain: "wilo2-1ee44.firebaseapp.com",
    projectId: "wilo2-1ee44",
    storageBucket: "wilo2-1ee44.firebasestorage.app",
    messagingSenderId: "103580826325",
    appId: "1:103580826325:web:0e5cc800c5cbb29691c05c"
  });
  const db = getFirestore(app, "wilo");
  window.__db = db;
  window.__setDoc = setDoc;
  window.__doc = doc;
  window.__collection = collection;
  window.__getDocs = getDocs;
  window.__query = query;
  window.__orderBy = orderBy;
  window.__limit = limit;
  // auth.js calls getApp() at load, so import it after initializeApp.
  import("./auth.js").then(a => a.onUser(user =>
    window.dispatchEvent(new CustomEvent("wilo-user", { detail: user }))));
</script>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="WILO">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta charset="utf-8">
<title>WILO</title>
<style>
  :root {
    --bg: #000;
    --panel: #0e0e0f;
    --field: #1c1c1e;
    --line: #262628;
    --text: #f2f2f7;
    --dim: #7c7c82;
    --accent: #0a84ff;
    --done: #1f4a2c;
    --done-line: #34c759;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; width: 100%; max-width: 100%; overflow-x: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font: 400 17px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
    position: fixed; top: 0; left: 0; right: 0;
    height: 100dvh;
    height: var(--vvh, 100dvh);
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--line); flex: none;
  }
.saved { margin: 2px 0 0; font-size: 12px; color: var(--dim); }
  .saved.ok { color: var(--done-line); }
  .finish {
    background: var(--accent); color: #fff; border: 0;
    padding: 8px 20px; border-radius: 999px; font-size: 16px; font-weight: 500;
  }

  .hbtns { display: flex; align-items: center; gap: 8px; }
  .who { background: none; border: 0; padding: 4px 0 0; color: var(--accent); font-family: inherit; font-size: 12px; }
  .ghost {
    background: var(--field); color: var(--text); border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 999px; font-family: inherit; font-size: 15px;
  }
  .swap {
    background: none; border: 1px solid var(--line); border-radius: 999px;
    color: var(--dim); font-family: inherit; font-size: 13px; padding: 5px 12px;
    margin-top: 10px;
  }
  .swap.on { color: var(--done-line); border-color: var(--done-line); }
  /* scrolling exercise list */
  .list { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: 90px; }

  .exercise { padding: 18px 16px 10px; border-bottom: 1px solid var(--line); }
  .exercise, .ex-head { min-width: 0; max-width: 100%; }
  .ex-head { display: flex; align-items: flex-start; gap: 8px; }
  .ex-name {
    flex: 1 1 auto; min-width: 0; background: transparent; border: 0; padding: 0 0 4px;
    color: var(--accent); font-family: inherit; font-size: 20px; font-weight: 600; line-height: 1.25;
  }
  .ex-note {
    display: block; width: 100%; min-width: 0; max-width: 100%;
    background: transparent; border: 0; padding: 0 0 14px;
    color: var(--dim); font-family: inherit; font-size: 16px; font-weight: 400; line-height: 1.3;
  }
  .ex-name:focus, .ex-note:focus { outline: none; box-shadow: 0 1px 0 var(--accent); }
  .sess-name-input {
    background: transparent; border: 0; padding: 0; width: 100%;
    color: inherit; font-family: inherit; font-size: 28px; font-weight: 700; line-height: 1.2;
  }
  .sess-name-input:focus { outline: none; box-shadow: 0 1px 0 var(--accent); }
  .ex-name::placeholder { color: #2d5c8a; }
  .ex-note::placeholder { color: #4a4a4f; }
  .kill {
    background: none; border: 0; color: var(--dim);
    font-size: 20px; line-height: 1; padding: 2px 4px;
  }

  table { width: 100%; max-width: 480px; border-collapse: collapse; table-layout: fixed; }
  th { color: var(--dim); font-size: 13px; font-weight: 500; padding-bottom: 10px; text-align: center; }
  td { padding: 4px 0; text-align: center; }
  td:first-child { text-align: left; }

  .setno {
    width: 34px; height: 34px; margin: 0 auto; background: var(--field);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 600;
  }

  input[type=number], input[type=text] {
    width: 72px; height: 38px; background: var(--field); border: 0; border-radius: 8px;
    color: var(--text); font-family: inherit; font-size: 17px; font-weight: 500; text-align: center;
    appearance: textfield; -moz-appearance: textfield;
  }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .check { width: 44px; height: 36px; border: 0; border-radius: 8px; background: var(--field); color: var(--dim); font-size: 17px; }
  tr.done .check { background: var(--done); color: var(--done-line); }
  tr.done input[type=number], tr.done input[type=text] { background: var(--done); }

  .add, .add-ex {
    width: 100%; padding: 13px; background: var(--field); border: 0;
    border-radius: 10px; color: var(--text); font-family: inherit; font-size: 16px; font-weight: 400;
  }
  .add { margin-top: 14px; }
  .add-ex-wrap { padding: 18px 16px; }
  .add-ex { width: 100%; color: var(--accent); }

  /* JSON sheet */
  .json-btn {
    position: fixed; right: 16px; bottom: 20px; z-index: 3;
    background: var(--field); border: 1px solid var(--line); color: var(--text);
    padding: 11px 18px; border-radius: 999px;
    font: 500 15px ui-monospace, SFMono-Regular, Menlo, monospace;
    box-shadow: 0 4px 16px rgba(0,0,0,.6);
  }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
    background: var(--panel); border-top: 1px solid var(--line);
    height: 55vh; display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform .28s cubic-bezier(.3,.8,.4,1);
  }
  .sheet.open { transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line); flex: none;
  }
  .sheet-head span { font-size: 13px; color: var(--dim); }
  .sheet-head .last { color: var(--accent); font-family: ui-monospace, Menlo, monospace; }
  .sheet-head button { background: none; border: 0; color: var(--accent); font-family: inherit; font-size: 16px; }
  pre {
    flex: 1; overflow: auto; margin: 0; padding: 12px 16px;
    font: 400 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #a8d5ff; white-space: pre-wrap;
  }
</style>
</head>
<body>

<header>
  <div>
    <div style="font-size:11px;color:#4caf50;margin-bottom:4px;">v2026-10-03-auth</div>
    <input id="sessName" class="sess-name-input" value="WILO">
    <p class="saved" id="saved">Not saved yet</p>
    <button class="who" id="authBtn" hidden>Sign in</button>
  </div>
  <div class="hbtns">
    <button class="ghost" id="resetBtn">Reset</button>
    <button class="ghost" id="loadBtn">Load</button>
    <button class="finish" id="finish">Finish</button>
  </div>
</header>

<div class="list" id="list"></div>

<button class="json-btn" id="jsonBtn">{ }</button>

<div class="sheet" id="sheet">
  <div class="sheet-head">
    <span class="last" id="last">state</span>
    <button id="closeSheet">Close</button>
  </div>
  <pre id="state"></pre>
</div>

<script>
  let nextId = 1;
  const uid = () => 'ex' + (nextId++) + '-' + Math.random().toString(36).slice(2, 7);
  const deriveExId = name => (name || '').toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');

  // Assigned workout loaded from Firestore assigned collection
  let loadedWorkout = null;

  // ---- program -> logging state -------------------------------------
  function makeExercise(def) {
    const timed = !!(def.target && def.target.duration_sec);
    const defaultLbs = def.start_weight_lbs || 0;
    const defaultReps = timed ? (def.target.duration_sec[0])
                               : (def.target && def.target.reps ? def.target.reps : 10);
    // def.sets can be a number (program) or an array of logged sets (export)
    const sets = Array.isArray(def.sets)
      ? def.sets.map(s => ({ lbs: s.lbs ?? defaultLbs, reps: s.reps ?? defaultReps, done: s.done ?? false, custom: s.custom || null }))
      : Array.from({ length: def.sets || 1 }, () => ({ lbs: defaultLbs, reps: defaultReps, done: false, custom: null }));

    const exId = def.exId || deriveExId(def.name);

    return {
      instanceId: def.instanceId || def.id || uid(),
      exId,
      timed,
      name: def.name,
      custom_name: def.custom_name || null,
      note: def.cue || def.note || '',
      fallback: def.fallback || null,
      swapped: def.swapped || false,
      original: def.original || null,
      sets
    };
  }

  function loadWorkout(assigned) {
    if (!assigned || !assigned.id) throw new Error('invalid workout');
    loadedWorkout = assigned;
    state.workoutId = assigned.id;
    state.workoutName = assigned.name;
    state.exercises = (assigned.exercises || []).map(makeExercise);
    document.getElementById('sessName').value = assigned.name || 'WILO';
  }

  const state = { workoutId: null, workoutName: '', exercises: [] };

  const list = document.getElementById('list');
  const sheet = document.getElementById('sheet');
  let last = 'state';

  function draw() {
    list.innerHTML = '';
    state.exercises.forEach(ex => {
      const unit = ex.timed ? 'secs' : 'reps';
      const el = document.createElement('div');
      el.className = 'exercise';
      el.innerHTML = `
        <div class="ex-head">
          <input class="ex-name" value="${esc(ex.name)}" placeholder="Exercise name"
                 data-id="${ex.instanceId}" data-k="name">
          <button class="kill" data-kill="${ex.instanceId}">&times;</button>
        </div>
        <input class="ex-note" value="${esc(ex.note)}" placeholder="Add a note"
               data-id="${ex.instanceId}" data-k="note">
        <input class="ex-note" value="${esc(ex.custom_name || '')}" placeholder="Custom field name (e.g. incline height)"
               data-id="${ex.instanceId}" data-k="custom_name">
        <table>
          <thead><tr><th>Set</th>${ex.timed ? '' : '<th>lbs</th>'}<th>${unit}</th>${ex.custom_name ? `<th>${esc(ex.custom_name)}</th>` : ''}<th>&check;</th></tr></thead>
          <tbody>${ex.sets.map((s, i) => `
            <tr class="${s.done ? 'done' : ''}">
              <td><div class="setno">${i + 1}</div></td>
              ${ex.timed ? '' : `<td><input type="number" inputmode="numeric" value="${s.lbs}" data-id="${ex.instanceId}" data-i="${i}" data-k="lbs"></td>`}
              <td><input type="number" inputmode="numeric" value="${s.reps}" data-id="${ex.instanceId}" data-i="${i}" data-k="reps"></td>
              ${ex.custom_name ? `<td><input type="text" value="${esc(s.custom || '')}" data-id="${ex.instanceId}" data-i="${i}" data-k="custom"></td>` : ''}
              <td><button class="check" data-id="${ex.instanceId}" data-i="${i}">&check;</button></td>
            </tr>`).join('')}</tbody>
        </table>
        <button class="add" data-add="${ex.instanceId}">+ Add Set</button>
        ${ex.fallback || ex.swapped
          ? `<button class="swap ${ex.swapped ? 'on' : ''}" data-swap="${ex.instanceId}">${ex.swapped ? '\u21a9 Back to full range' : '\u21c4 Swap to easier version'}</button>`
          : ''}`;
      list.appendChild(el);
    });
    const wrap = document.createElement('div');
    wrap.className = 'add-ex-wrap';
    wrap.innerHTML = '<button class="add-ex" id="addEx">+ Add Exercise</button>';
    list.appendChild(wrap);
    sync();
  }

  function esc(s) { return String(s).replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

  function sync() {
    document.getElementById('state').textContent = JSON.stringify(state, null, 2);
    document.getElementById('last').textContent = last;
    queueSave();
  }

  list.addEventListener('blur', e => {
    if (e.target.dataset.k === 'custom_name') draw();
  }, true);

  list.addEventListener('input', e => {
    const el = e.target;
    if (el.tagName !== 'INPUT') return;
    const id = el.dataset.id, k = el.dataset.k;
    const ex = state.exercises.find(x => x.instanceId === id);
    if (!ex) return;

    if (el.dataset.i !== undefined) {
      const i = +el.dataset.i;
      ex.sets[i][k] = k === 'custom' ? el.value : (el.value === '' ? 0 : +el.value);
      last = `${ex.name}.sets[${i}].${k} = ${ex.sets[i][k]}`;
      sync();
    } else {
      ex[k] = el.value;
      if (k === 'name') ex.exId = deriveExId(el.value);
      last = `${ex.name}.${k}`;
      sync();
    }
  });

  list.addEventListener('click', e => {
    const chk = e.target.closest('.check');
    if (chk) {
      const id = chk.dataset.id, i = +chk.dataset.i;
      const ex = state.exercises.find(x => x.instanceId === id);
      if (!ex) throw new Error('no exercise for id ' + id);
      const s = ex.sets[i];
      s.done = !s.done;
      chk.closest('tr').classList.toggle('done', s.done);
      last = `${ex.name}.sets[${i}].done = ${s.done}`;
      return sync();
    }
    const add = e.target.closest('[data-add]');
    if (add) {
      const id = add.dataset.add;
      const ex = state.exercises.find(x => x.instanceId === id);
      if (!ex) throw new Error('no exercise for id ' + id);
      const sets = ex.sets;
      const p = sets[sets.length - 1];
      sets.push({ lbs: p ? p.lbs : 45, reps: p ? p.reps : 5, done: false, custom: null });
      last = `${ex.name}.sets.push()`;
      return draw();
    }
    const sw = e.target.closest('[data-swap]');
    if (sw) {
      const id = sw.dataset.swap;
      const ex = state.exercises.find(x => x.instanceId === id);
      if (!ex) throw new Error('no exercise for id ' + id);
      if (!ex.swapped && ex.fallback) {
        ex.original = { name: ex.name, note: ex.note, sets: ex.sets };
        const f = ex.fallback;
        ex.name = f.name;
        ex.note = f.cue || ex.note;
        ex.sets = Array.from({ length: f.sets || ex.sets.length },
          () => ({ lbs: 0, reps: (f.target && f.target.reps) || 8, done: false, custom: null }));
        ex.swapped = true;
      } else if (ex.original) {
        Object.assign(ex, ex.original);
        ex.swapped = false;
        ex.original = null;
      }
      last = `${ex.name}.swapped = ${ex.swapped}`;
      return draw();
    }
    const kill = e.target.closest('[data-kill]');
    if (kill) {
      const id = kill.dataset.kill;
      const idx = state.exercises.findIndex(x => x.instanceId === id);
      if (idx < 0) throw new Error('no exercise for id ' + id);
      last = `exercises.splice(${idx}, 1)`;
      state.exercises.splice(idx, 1);
      return draw();
    }
    if (e.target.id === 'addEx') {
      state.exercises.push({
        instanceId: uid(),
        exId: '',
        timed: false,
        name: '',
        custom_name: null,
        note: '',
        fallback: null,
        swapped: false,
        original: null,
        sets: [{ lbs: 45, reps: 5, done: false, custom: null }]
      });
      last = `exercises.push() \u2192 ${state.exercises.length}`;
      draw();
      const inputs = list.querySelectorAll('.ex-name');
      inputs[inputs.length - 1].focus();
    }
  });

  document.getElementById('jsonBtn').addEventListener('click', () => sheet.classList.toggle('open'));
  document.getElementById('closeSheet').addEventListener('click', () => sheet.classList.remove('open'));

  // Lock the app to the visual viewport: the keyboard shrinks the scroll
  // area instead of displacing the whole layout.
  const vv = window.visualViewport;
  function lockViewport() {
    const h = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty('--vvh', h + 'px');
    window.scrollTo(0, 0);
  }
  if (vv) {
    vv.addEventListener('resize', lockViewport);
    vv.addEventListener('scroll', lockViewport);
  }
  window.addEventListener('resize', lockViewport);
  lockViewport();

  // iOS still nudges the document on focus; snap it back on the next frame.
  document.addEventListener('focusin', () => {
    requestAnimationFrame(() => { window.scrollTo(0, 0); lockViewport(); });
  });

  // ---- persistence -------------------------------------------------
  const KEY = 'workout-log-draft';
  const savedEl = document.getElementById('saved');

  // One place to surface a problem. The status line is already on screen,
  // which beats a console you can't open on a phone.
  // Errors hold the line for a few seconds. Without this the autosave tick
  // (400ms) overwrites the message with "Saved 3:57 PM" before it can be read.
  let noteUntil = 0;
  function note(msg) {
    savedEl.textContent = msg;
    savedEl.classList.remove('ok');
    noteUntil = Date.now() + 8000;
  }
  window.addEventListener('error', ev => {
    note('Error: ' + (ev.message || 'unknown') + (ev.lineno ? ' @' + ev.lineno : ''));
  });
  window.addEventListener('unhandledrejection', ev => {
    const r = ev.reason;
    note('Error: ' + (r && (r.name || r.message) ? (r.name || r.message) : r));
  });
  let saveTimer = null;

  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ savedAt: Date.now(), state }));
      if (Date.now() < noteUntil) return;   // don't stomp a visible error
      const t = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
      savedEl.textContent = 'Saved ' + t;
      savedEl.classList.add('ok');
    } catch (err) {
      note("Couldn't save to this browser");
    }
  }

  function queueSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 400);
  }

  function restore() {
    let raw;
    try { raw = localStorage.getItem(KEY); } catch (err) { return; }
    if (!raw) return;
    try {
      const saved = JSON.parse(raw);
      if (!saved.state || !Array.isArray(saved.state.exercises)) return;
      state.exercises = saved.state.exercises;
      state.workoutId = saved.state.workoutId || null;
      state.workoutName = saved.state.workoutName || '';
      if (state.workoutName) document.getElementById('sessName').value = state.workoutName;
      state.exercises.forEach(ex => {
        if (!ex.instanceId) ex.instanceId = uid();
        if (!ex.exId && ex.name) ex.exId = deriveExId(ex.name);
        if (ex.timed === undefined) ex.timed = false;
        if (ex.swapped === undefined) ex.swapped = false;
      });
      const t = new Date(saved.savedAt).toLocaleString([], {
        month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
      });
      savedEl.textContent = 'Restored from ' + t;
      savedEl.classList.add('ok');
    } catch (err) { /* corrupt draft: start fresh */ }
  }

  function download() {
    const stamp = new Date();
    const pad = n => String(n).padStart(2, '0');
    const slug = `${state.workoutName || ''}-${state.workoutId || 'workout'}`.replace(/[^a-z0-9_-]/gi, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
    const name = `${stamp.getFullYear()}-${pad(stamp.getMonth() + 1)}-${pad(stamp.getDate())}` +
                 `-${pad(stamp.getHours())}${pad(stamp.getMinutes())}-${slug}.json`;

    const payload = {
      id: state.workoutId,
      name: state.workoutName,
      finishedAt: stamp.toISOString(),
      exercises: state.exercises.map(ex => ({
        instanceId: ex.instanceId,
        exId: ex.exId,
        name: ex.name,
        cue: ex.note || '',
        custom_name: ex.custom_name || null,
        timed: ex.timed,
        swapped: ex.swapped,
        fallback: ex.fallback || null,
        sets: ex.sets.map(s => ({ lbs: s.lbs, reps: s.reps, done: s.done, custom: s.custom || null }))
      }))
    };

    if (window.__db && window.__doc && window.__setDoc) {
      const day = pad(stamp.getDate());
      const month = stamp.toLocaleString('en-US', { month: 'short' }).toLowerCase();
      const hour = pad(stamp.getHours());
      const minute = pad(stamp.getMinutes());
      const nameSlug = (state.workoutName || 'workout').slice(0, 5).toLowerCase().replace(/\s+/g, '-');
      const rand = Math.random().toString(36).slice(2, 6);
      const docId = `${day}-${month}-${hour}:${minute}-${nameSlug}-${rand}`;
      window.__setDoc(window.__doc(window.__db, 'completed', docId), payload)
        .catch(err => note('Firestore save failed: ' + err.message));
      if (window.__auth && window.__auth.currentUser()) {
        window.__setDoc(window.__auth.userDoc('completed', docId), payload)
          .catch(err => note('Firestore user save failed: ' + err.message));
      }
    }

    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return name;
  }

  document.getElementById('finish').addEventListener('click', () => {
    persist();
    const name = download();
    savedEl.textContent = 'Downloaded ' + name;
    savedEl.classList.add('ok');
  });

  // ---- program loading ----------------------------------------------
  // Signed in: newest of users/{uid}/assigned and top-level assigned (the
  // coach skill still writes top-level until it moves to per-user paths).
  async function fetchLatestAssigned() {
    const cols = [window.__collection(window.__db, 'assigned')];
    if (window.__auth && window.__auth.currentUser()) cols.unshift(window.__auth.userCol('assigned'));
    const at = v => (v && v.toMillis ? v.toMillis() : v);
    let best = null;
    for (const col of cols) {
      let snap;
      try {
        snap = await window.__getDocs(window.__query(
          col, window.__orderBy('assignedFor', 'desc'), window.__limit(1)
        ));
      } catch (err) {
        // A failing per-user read must not block the top-level fallback.
        if (col.path === 'assigned') throw err;
        note('User workouts unavailable: ' + err.message);
        continue;
      }
      if (snap.empty) continue;
      const hit = { data: snap.docs[0].data(), id: snap.docs[0].id };
      if (!best || at(hit.data.assignedFor) > at(best.data.assignedFor)) best = hit;
    }
    return best;
  }

  document.getElementById('sessName').addEventListener('input', e => {
    state.workoutName = e.target.value;
  });

  document.getElementById('loadBtn').addEventListener('click', async () => {
    try {
      note('Loading latest workout…');
      const latest = await fetchLatestAssigned();
      if (!latest) { note('No workouts found'); return; }
      loadWorkout(latest.data);
      last = 'loaded ' + (state.workoutId || latest.id);
      draw();
      note('Loaded ' + (state.workoutName || latest.id));
    } catch (err) {
      note("Couldn't load workout: " + (err && err.message ? err.message : err));
    }
  });

  // ---- sign-in -------------------------------------------------------
  // Optional for now: signed out, everything uses the top-level collections
  // exactly as before. Signed in, saves are mirrored under users/{uid}.
  const authBtn = document.getElementById('authBtn');
  let authSeen = false;
  window.addEventListener('wilo-user', ev => {
    const user = ev.detail;
    authBtn.hidden = false;
    authBtn.textContent = user ? user.email + ' \u00b7 Sign out' : 'Sign in';
    // First event is just the restored session; don't clobber the status line.
    if (authSeen) note(user ? 'Signed in as ' + user.email : 'Signed out');
    authSeen = true;
  });
  authBtn.addEventListener('click', async () => {
    const a = window.__auth;
    if (!a) return;
    try {
      if (a.currentUser()) {
        if (confirm('Sign out of ' + a.currentUser().email + '?')) await a.signOut();
      } else {
        await a.signIn();
      }
    } catch (err) {
      note('Sign-in failed: ' + (err.code || err.message));
    }
  });

  // ---- reset ---------------------------------------------------------
  // Without this the only way to clear a stale draft is the Files app.
  // Resets to the workout currently loaded from Firestore.
  document.getElementById('resetBtn').addEventListener('click', () => {
    if (!loadedWorkout) { note('No workout loaded'); return; }
    const logged = state.exercises.flatMap(x => x.sets).filter(s => s.done).length;
    const msg = logged
      ? `Discard ${logged} logged set${logged === 1 ? '' : 's'} and start this workout over?`
      : 'Reset to the assigned workout?';
    if (!confirm(msg)) return;
    try { localStorage.removeItem(KEY); } catch {}
    loadWorkout(loadedWorkout);
    last = 'reset to ' + (state.workoutId || 'workout');
    draw();
    note('Reset to ' + (state.workoutName || 'assigned'));
  });

  // Boot: restore any saved draft, then try loading latest from Firestore
  restore();
  draw();

  // Load latest assigned workout from Firestore on boot
  if (window.__db && window.__collection && window.__getDocs && window.__query && window.__orderBy && window.__limit) {
    (async () => {
      try {
        const latest = await fetchLatestAssigned();
        if (latest) {
          loadWorkout(latest.data);
          draw();
          note('Loaded ' + (state.workoutName || latest.id));
        }
      } catch (err) {
        note('Could not load workout from Firestore');
      }
    })();
  }
</script>

</body>
</html>

<!DOCTYPE html>
<!--
  WILO Calendar (experiment, #45): workouts and todos by week or by day, drag to move.

  - Separate page, like today.html. Sign-in required (auth.js).
  - Data (live, onSnapshot): users/{uid}/workouts and users/{uid}/todos. Nothing new is stored.
      a workout sits on its assignedFor day (or the day it was finished if it has none);
      a todo sits on the date in its due ("2026-11-09" or "2026-11-09 19:00"); its time is the
      HH:MM after the date. Open todos with no date (or a free-text due like "friday") wait in
      "No date".
  - Week view: Mon–Sun (stacked on a phone, 7 columns on a wide screen). Tap a day's name for its day view.
    Day view: an "Anytime" strip (workouts, todos with a date but no time) above an hour grid, 6:00–24:00.
  - Drag (hold ~0.3 s on a phone, or just drag with a mouse):
      a todo onto a week day       → due's date changes, its time stays
      a todo onto the hour grid    → due = that day + the time under the finger, snapped to 15 min
      a todo onto "Anytime"        → due = that day, no time
      a todo onto "No date"        → due is removed
      a planned / in-progress workout onto a day (either view) → assignedFor = that day ("YYYY-MM-DD")
      hover over ‹ or › while dragging → flips the week (or day)
    Done workouts and done todos don't move: they're history.
    Moving a workout needs firestore.rules to allow assignedFor in the tracker's updates.
  - Tap a workout to open the tracker; tap the circle to check a todo off.
  - Every write shows "Saved ✓" only after Firestore confirms; on failure the item jumps back.
-->
<html lang="en">
<head>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getFirestore, setDoc, onSnapshot, deleteField } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
  // Same config as index.html; see the authDomain note there.
  const onHosting = /\.web\.app$|\.firebaseapp\.com$/.test(location.hostname);
  const app = initializeApp({
    apiKey: "AIzaSyDQ-MDgxaD6vab2awYKuez3vLB-Tmj6oLM",
    authDomain: onHosting ? location.host : "wilo2-1ee44.firebaseapp.com",
    projectId: "wilo2-1ee44",
    storageBucket: "wilo2-1ee44.firebasestorage.app",
    messagingSenderId: "103580826325",
    appId: "1:103580826325:web:0e5cc800c5cbb29691c05c"
  });
  getFirestore(app, "wilo");
  window.__fs = { setDoc, onSnapshot, deleteField };
  import("./auth.js")
    .then(a => a.onUser(user =>
      window.dispatchEvent(new CustomEvent("wilo-user", { detail: user }))))
    .catch(err => window.dispatchEvent(new CustomEvent("wilo-auth-error", { detail: err })));
</script>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="WILO">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>WILO Calendar</title>
<style>
  :root {
    --bg: #000;
    --panel: #0e0e0f;
    --field: #1c1c1e;
    --line: #262628;
    --text: #f2f2f7;
    --dim: #7c7c82;
    --accent: #0a84ff;
    --workout: #2b2141;
    --workout-line: #bf5af2;
    --done: #1f4a2c;
    --done-line: #34c759;
    --hour: 60px;            /* one hour of the day grid; 15 min = 15px */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; width: 100%; overflow-x: hidden; }
  body {
    background: var(--bg); color: var(--text); min-height: 100dvh;
    font: 400 16px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  body.dragging { cursor: grabbing; -webkit-user-select: none; user-select: none; }

  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 12px 16px 8px; border-bottom: 1px solid var(--line);
  }
  .top { display: flex; align-items: center; gap: 12px; }
  h1 { margin: 0; font-size: 28px; font-weight: 700; flex: 1; }
  .top a { color: var(--accent); font-size: 15px; text-decoration: none; }
  .seg { display: flex; background: var(--field); border-radius: 9px; padding: 2px; }
  .seg button {
    height: 30px; padding: 0 12px; border: 0; border-radius: 7px; background: none;
    color: var(--dim); font: inherit; font-size: 14px;
  }
  .seg button.on { background: #3a3a3e; color: var(--text); }
  .nav { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .nav button {
    height: 36px; min-width: 44px; padding: 0 12px; border: 0; border-radius: 10px;
    background: var(--field); color: var(--text); font: inherit; font-size: 18px;
  }
  .nav button.hot { background: var(--accent); }
  .nav #todayBtn { font-size: 15px; }
  .nav .label { flex: 1; text-align: center; color: var(--dim); font-size: 15px; }
  .saved { margin: 4px 0 0; font-size: 12px; color: var(--dim); min-height: 15px; }
  .saved.ok { color: var(--done-line); }
  .saved.err { color: #ff453a; }

  h2 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
  .over { background: #0a84ff22; outline: 2px dashed var(--accent); outline-offset: -2px; }
  .items { display: flex; flex-direction: column; gap: 6px; }
  .empty { color: #3a3a3e; font-size: 13px; }

  /* Week view. Phone: days stacked. Wide screens: 7 columns. */
  .week { display: flex; flex-direction: column; }
  .day { border-bottom: 1px solid var(--line); padding: 8px 12px 10px; min-height: 64px; transition: background .1s; }
  .day h2 { cursor: pointer; }
  .day.today h2 { color: var(--accent); }
  @media (min-width: 900px) {
    .week { flex-direction: row; align-items: stretch; min-height: 60vh; }
    .day { flex: 1 1 0; min-width: 0; border-bottom: 0; border-right: 1px solid var(--line); }
  }

  /* Day view: Anytime strip, then the hour grid. */
  .anytime { padding: 8px 12px 10px; border-bottom: 1px solid var(--line); min-height: 56px; }
  .grid { position: relative; margin: 0 12px 0 0; }
  .hour { height: var(--hour); border-top: 1px solid var(--line); position: relative; }
  .hour::after { content: ""; position: absolute; left: 52px; right: 0; top: 50%; border-top: 1px dotted #1a1a1c; }
  .hour span { position: absolute; left: 8px; top: -8px; background: var(--bg); padding: 0 4px; color: var(--dim); font-size: 11px; }
  .lane { position: absolute; left: 56px; right: 0; top: 0; bottom: 0; }
  .item.timed { position: absolute; padding: 3px 8px; min-height: 28px; overflow: hidden; gap: 6px; }
  .item.timed .check { width: 18px; height: 18px; font-size: 10px; border-width: 1.5px; }
  .item.timed .body { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
  .item.timed .text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .item.timed .meta { flex: none; margin: 0; }
  .now { position: absolute; left: 52px; right: 0; border-top: 2px solid #ff453a; z-index: 2; pointer-events: none; }
  .drop { position: absolute; left: 52px; right: 0; border-top: 2px solid var(--accent); z-index: 3; pointer-events: none; }
  .drop span { position: absolute; left: -50px; top: -9px; background: var(--accent); color: #fff; font-size: 11px; padding: 1px 4px; border-radius: 4px; }

  .item {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px;
    background: var(--field); touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .item.movable { cursor: grab; }
  .item.workout { background: var(--workout); border-left: 3px solid var(--workout-line); }
  .item.workout.done { background: var(--done); border-left-color: var(--done-line); }
  .item.todo.done .text { color: var(--dim); text-decoration: line-through; }
  .item.lifted { opacity: .3; }
  .item .body { min-width: 0; flex: 1; }
  .item .text { overflow-wrap: anywhere; font-size: 15px; }
  .item .meta { color: var(--dim); font-size: 12px; margin-top: 1px; }
  .check {
    flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--dim);
    background: none; color: transparent; font-size: 13px; line-height: 1; padding: 0;
  }
  .item.done .check { background: var(--done); border-color: var(--done-line); color: var(--done-line); }

  .ghost {
    position: fixed; z-index: 20; pointer-events: none; margin: 0;
    box-shadow: 0 8px 24px #000a; transform: rotate(-2deg) scale(1.03); opacity: .95;
  }

  .tray { margin-top: 16px; padding: 8px 12px 12px; border-top: 1px solid var(--line); min-height: 72px; }
  .hint { color: var(--dim); font-size: 12px; padding: 0 12px; margin-top: 12px; }

  .gate {
    position: fixed; inset: 0; z-index: 30; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 24px; text-align: center;
  }
  .gate[hidden] { display: none; }
  .gate h1 { font-size: 34px; flex: none; }
  .gate p { margin: 0; color: var(--dim); font-size: 15px; }
  .gate button {
    height: 42px; padding: 0 20px; border: 0; border-radius: 999px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 500;
  }
</style>
</head>
<body>

<div class="gate" id="gate">
  <h1>WILO</h1>
  <p id="gateMsg">Checking sign-in…</p>
  <button id="gateBtn" hidden>Sign in with Google</button>
</div>

<header>
  <div class="top">
    <h1>Calendar</h1>
    <div class="seg"><button id="weekView">Week</button><button id="dayView">Day</button></div>
    <a href="today.html">Today</a>
  </div>
  <div class="nav">
    <button id="prevBtn" aria-label="Back">‹</button>
    <button id="todayBtn">Now</button>
    <span class="label" id="label"></span>
    <button id="nextBtn" aria-label="Forward">›</button>
  </div>
  <p class="saved" id="saved"></p>
</header>

<main id="main"></main>
<div class="tray" id="tray" data-day="" data-time="">
  <h2>No date</h2>
  <div class="items" id="trayItems"></div>
</div>
<p class="hint">Hold and drag to move things. In the day view, drop a todo on a time to set it.</p>

<script>
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');

  // ---- dates (local days as "YYYY-MM-DD"; noon avoids DST edges) -------
  function localDay(d) {
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function addDays(day, n) {
    const d = new Date(day + 'T12:00:00');
    d.setDate(d.getDate() + n);
    return localDay(d);
  }
  // Monday of the week that holds day.
  function weekStart(day) {
    const dow = (new Date(day + 'T12:00:00').getDay() + 6) % 7;
    return addDays(day, -dow);
  }
  // Same as dayOf in index.html: a bare date stays; a timestamp becomes its local day.
  function dayOf(v) {
    if (!v) return '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
    const d = new Date(v);
    return isNaN(d) ? '' : localDay(d);
  }
  // A todo's day: the date at the start of due, or '' (free text or none).
  function todoDay(due) {
    const m = /^(\d{4}-\d{2}-\d{2})\b/.exec(due || '');
    return m ? m[1] : '';
  }
  // A todo's time: "HH:MM" right after its date, or ''.
  function todoTime(due) {
    const m = /^\d{4}-\d{2}-\d{2}[ T](\d{1,2}):(\d{2})/.exec(due || '');
    return m ? `${pad(+m[1])}:${m[2]}` : '';
  }
  // The due after a drop. time undefined: keep the old time (week view); '' : no time; 'HH:MM': that time.
  // An empty day means "No date".
  function movedDue(due, day, time) {
    if (!day) return '';
    if (time !== undefined) return time ? `${day} ${time}` : day;
    const m = /^\d{4}-\d{2}-\d{2}(.*)$/.exec(due || '');
    return day + (m ? m[1] : '');
  }

  // ---- the day grid ------------------------------------------------------
  const START_H = 6, END_H = 24, SNAP = 15, LEN = 30;   // grid hours; minutes per snap; minutes an item fills
  const PX_PER_MIN = 1;                                 // --hour is 60px
  const toMin = t => +t.slice(0, 2) * 60 + +t.slice(3, 5);
  // The time under a point `px` below the grid's top, snapped, kept inside the day.
  function slotTime(px) {
    const m = Math.round((START_H * 60 + px / PX_PER_MIN) / SNAP) * SNAP;
    const c = Math.max(0, Math.min(24 * 60 - SNAP, m));
    return `${pad(Math.floor(c / 60))}:${pad(c % 60)}`;
  }
  // Side-by-side columns for items that overlap. starts: minutes, sorted. → [{col, cols}]
  function layout(starts) {
    const out = [];
    let group = [], ends = [];   // the current run of overlapping items; per column, when it frees up
    const close = () => { const n = ends.length; group.forEach(i => { out[i].cols = n; }); group = []; ends = []; };
    starts.forEach((s, i) => {
      if (ends.length && ends.every(e => e <= s)) close();
      let col = ends.findIndex(e => e <= s);
      if (col === -1) col = ends.length;
      ends[col] = s + LEN;
      out[i] = { col, cols: 1 };
      group.push(i);
    });
    close();
    return out;
  }

  // ---- state ----------------------------------------------------------
  let workouts = [], todos = [];
  let focus = localDay(new Date());   // the day in day view; its week in week view
  let view = 'week';
  try { if (localStorage.getItem('wilo-cal-view') === 'day') view = 'day'; } catch {}
  const unsub = [];

  function note(msg, kind) {
    $('saved').textContent = msg;
    $('saved').className = 'saved' + (kind ? ' ' + kind : '');
  }

  // Everything that goes on the calendar, as {kind, id, day, time, ...}.
  function entries() {
    const out = [];
    for (const w of workouts) {
      const day = dayOf(w.assignedFor || w.finishedAt);
      if (!day) continue;
      out.push({ kind: 'workout', id: w.docId, day, time: '', text: w.name || w.docId, done: w.status === 'done',
                 meta: w.status === 'done' ? 'Done' : w.status === 'in progress' ? 'In progress' : `${(w.exercises || []).length} exercises`,
                 sort: '0' });
    }
    for (const t of todos) {
      const day = todoDay(t.due);
      if (!day && t.done) continue;   // done with no date: gone from the calendar
      const time = day ? todoTime(t.due) : '';
      out.push({ kind: 'todo', id: t.docId, day, time, text: t.text, done: !!t.done,
                 meta: day ? time : (t.due || ''), sort: '1' + (time || '99') + (t.createdAt || '') });
    }
    return out.sort((a, b) => a.sort.localeCompare(b.sort));
  }

  // ---- draw -----------------------------------------------------------
  const fmt = (d, o) => new Date(d + 'T12:00:00').toLocaleDateString(undefined, o);

  function draw(scroll) {
    $('weekView').classList.toggle('on', view === 'week');
    $('dayView').classList.toggle('on', view === 'day');
    $('todayBtn').textContent = view === 'week' ? 'This week' : 'Today';
    const all = entries();
    $('main').innerHTML = '';
    if (view === 'week') drawWeek(all); else drawDay(all, scroll);
    const loose = all.filter(e => !e.day);
    $('trayItems').innerHTML = loose.length ? '' : '<span class="empty">Nothing without a date.</span>';
    loose.forEach(e => $('trayItems').appendChild(card(e)));
  }

  function drawWeek(all) {
    const today = localDay(new Date());
    const start = weekStart(focus);
    const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
    $('label').textContent = `${fmt(days[0], { month: 'short', day: 'numeric' })} – ${fmt(days[6], { month: 'short', day: 'numeric' })}`;
    const wrap = document.createElement('div');
    wrap.className = 'week';
    for (const day of days) {
      const box = document.createElement('section');
      box.className = 'day drop-target' + (day === today ? ' today' : '');
      box.dataset.day = day;
      const h = document.createElement('h2');
      h.dataset.open = day;
      h.textContent = fmt(day, { weekday: 'short', month: 'short', day: 'numeric' }) + (day === today ? ' · Today' : '');
      const list = document.createElement('div');
      list.className = 'items';
      const here = all.filter(e => e.day === day);
      if (!here.length) list.innerHTML = '<span class="empty">—</span>';
      here.forEach(e => list.appendChild(card(e)));
      box.append(h, list);
      wrap.appendChild(box);
    }
    $('main').appendChild(wrap);
  }

  function drawDay(all, scroll) {
    const day = focus, today = localDay(new Date());
    $('label').textContent = fmt(day, { weekday: 'long', month: 'short', day: 'numeric' }) + (day === today ? ' · Today' : '');
    const here = all.filter(e => e.day === day);

    const any = document.createElement('section');
    any.className = 'anytime drop-target';
    any.dataset.day = day;
    any.dataset.time = '';
    any.innerHTML = '<h2>Anytime</h2>';
    const list = document.createElement('div');
    list.className = 'items';
    const loose = here.filter(e => !e.time);
    if (!loose.length) list.innerHTML = '<span class="empty">—</span>';
    loose.forEach(e => list.appendChild(card(e)));
    any.appendChild(list);

    const grid = document.createElement('section');
    grid.className = 'grid drop-target';
    grid.dataset.day = day;
    grid.dataset.grid = '1';
    for (let h = START_H; h < END_H; h++) {
      const row = document.createElement('div');
      row.className = 'hour';
      row.innerHTML = `<span>${pad(h)}:00</span>`;
      grid.appendChild(row);
    }
    const lane = document.createElement('div');
    lane.className = 'lane';
    const timed = here.filter(e => e.time);
    const top = e => Math.max(0, toMin(e.time) - START_H * 60) * PX_PER_MIN;
    const cols = layout(timed.map(e => Math.max(toMin(e.time), START_H * 60)));
    timed.forEach((e, i) => {
      const el = card(e);
      el.classList.add('timed');
      el.style.top = top(e) + 'px';
      el.style.height = (LEN * PX_PER_MIN - 2) + 'px';
      el.style.left = `calc(${cols[i].col} * 100% / ${cols[i].cols})`;
      el.style.width = `calc(100% / ${cols[i].cols} - 4px)`;
      lane.appendChild(el);
    });
    grid.appendChild(lane);
    if (day === today) {
      const now = new Date(), m = now.getHours() * 60 + now.getMinutes();
      if (m >= START_H * 60) {
        const line = document.createElement('div');
        line.className = 'now';
        line.style.top = (m - START_H * 60) * PX_PER_MIN + 'px';
        grid.appendChild(line);
      }
    }
    $('main').append(any, grid);

    // On opening a day: scroll to an hour before now (today) or to the first timed item / 8:00.
    if (scroll) {
      const now = new Date();
      const target = day === today ? now.getHours() * 60 - 60 : timed.length ? toMin(timed[0].time) - 60 : 8 * 60;
      const y = grid.getBoundingClientRect().top + window.scrollY + Math.max(0, target - START_H * 60) * PX_PER_MIN;
      window.scrollTo(0, Math.max(0, y - document.querySelector('header').offsetHeight - any.offsetHeight));
    }
  }

  function card(e) {
    const el = document.createElement('div');
    el.className = `item ${e.kind}` + (e.done ? ' done' : '') + (e.done ? '' : ' movable');
    el.dataset.kind = e.kind;
    el.dataset.id = e.id;
    if (e.kind === 'todo') {
      const c = document.createElement('button');
      c.className = 'check';
      c.textContent = '✓';
      c.setAttribute('aria-label', e.done ? 'Mark not done' : 'Mark done');
      el.appendChild(c);
    }
    const body = document.createElement('div');
    body.className = 'body';
    const text = document.createElement('div');
    text.className = 'text';
    text.textContent = e.text;
    body.appendChild(text);
    if (e.meta) {
      const m = document.createElement('div');
      m.className = 'meta';
      m.textContent = e.meta;
      body.appendChild(m);
    }
    el.appendChild(body);
    return el;
  }

  function show(v, day) {
    view = v;
    if (day) focus = day;
    try { localStorage.setItem('wilo-cal-view', v); } catch {}
    draw(v === 'day');
  }

  // ---- writes (shown at once; Firestore's listener confirms, failure rolls back) ----
  async function save(col, id, fields, rollback) {
    note('Saving…');
    try {
      await window.__fs.setDoc(window.__auth.userDoc(col, id), fields, { merge: true });
      note('Saved ✓', 'ok');
    } catch (err) {
      rollback();
      draw();
      note('Save failed: ' + (err.code || err.message) + '. Try again.', 'err');
    }
  }

  // time: undefined keeps a todo's time, '' clears it, 'HH:MM' sets it. Workouts only take the day.
  function move(kind, id, day, time) {
    if (kind === 'workout') {
      const w = workouts.find(x => x.docId === id);
      if (!w || !day || w.status === 'done' || dayOf(w.assignedFor) === day) return;
      const before = w.assignedFor;
      w.assignedFor = day;
      draw();
      save('workouts', id, { assignedFor: day }, () => { w.assignedFor = before; });
    } else {
      const t = todos.find(x => x.docId === id);
      if (!t || t.done) return;
      const before = t.due;
      const due = movedDue(t.due, day, time);
      if ((due || '') === (before || '')) return;
      if (due) t.due = due; else delete t.due;
      draw();
      save('todos', id, { due: due || window.__fs.deleteField() }, () => { if (before) t.due = before; else delete t.due; });
    }
  }

  function toggle(id) {
    const t = todos.find(x => x.docId === id);
    if (!t) return;
    const before = { done: t.done, doneAt: t.doneAt };
    t.done = !t.done;
    t.doneAt = t.done ? new Date().toISOString() : undefined;
    draw();
    save('todos', id, { done: t.done, doneAt: t.done ? t.doneAt : window.__fs.deleteField() }, () => Object.assign(t, before));
  }

  // ---- drag: a mouse drags at once; a finger holds ~0.3 s first, so a swipe still scrolls ----
  // Touch uses touch events, not pointer events: the browser cancels a pointer as soon as it starts
  // scrolling, but a non-passive touchmove can stop the scroll once the drag has begun.
  const HOLD_MS = 300, SLOP = 8, EDGE = 70, FLIP_MS = 600;
  let press = null;   // {el, x, y, mouse, timer}
  let drag = null;    // {el, ghost, dx, dy, kind, id, target, time, x, y, flip:{btn, at}, tick}

  function down(target, x, y, mouse) {
    const el = target.closest('.item.movable');
    if (!el || target.closest('.check')) return;
    press = { el, x, y, mouse };
    if (!mouse) press.timer = setTimeout(() => startDrag(press.x, press.y), HOLD_MS);
  }
  function moveTo(x, y) {
    if (drag) { follow(x, y); return; }
    if (!press) return;
    if (Math.hypot(x - press.x, y - press.y) <= SLOP) return;
    if (press.mouse) startDrag(x, y);
    else cancelPress();   // finger moved before the hold: it's a scroll
  }
  function up() {
    if (drag) { endDrag(true); return; }
    if (!press) return;
    const el = press.el;
    cancelPress();
    if (el.dataset.kind === 'workout') location.href = 'index.html';   // tap: open the tracker
  }

  document.addEventListener('mousedown', ev => { if (ev.button === 0) down(ev.target, ev.clientX, ev.clientY, true); });
  document.addEventListener('mousemove', ev => moveTo(ev.clientX, ev.clientY));
  document.addEventListener('mouseup', up);

  document.addEventListener('touchstart', ev => {
    if (ev.touches.length > 1) { cancelPress(); if (drag) endDrag(false); return; }
    const t = ev.touches[0];
    down(ev.target, t.clientX, t.clientY, false);
  }, { passive: true });
  document.addEventListener('touchmove', ev => {
    const t = ev.touches[0];
    if (drag) ev.preventDefault();   // the page must not scroll under a drag
    moveTo(t.clientX, t.clientY);
  }, { passive: false });
  document.addEventListener('touchend', ev => {
    if (drag || press) ev.preventDefault();   // no ghost mouse events after a touch
    up();
  }, { passive: false });
  document.addEventListener('touchcancel', () => { cancelPress(); if (drag) endDrag(false); });
  document.addEventListener('contextmenu', ev => { if (drag || press) ev.preventDefault(); });

  document.addEventListener('click', ev => {
    const c = ev.target.closest('.check');
    if (c) { toggle(c.closest('.item').dataset.id); return; }
    const h = ev.target.closest('[data-open]');
    if (h) show('day', h.dataset.open);   // a week day's name opens its day view
  });

  function cancelPress() {
    if (press) clearTimeout(press.timer);
    press = null;
  }

  function startDrag(x, y) {
    if (!press) return;
    const el = press.el, r = el.getBoundingClientRect();
    clearTimeout(press.timer);
    press = null;
    const ghost = el.cloneNode(true);
    ghost.classList.remove('timed');
    ghost.classList.add('ghost');
    ghost.style.cssText = `width:${Math.max(r.width, 160)}px`;
    document.body.appendChild(ghost);
    el.classList.add('lifted');
    document.body.classList.add('dragging');
    if (navigator.vibrate) navigator.vibrate(15);
    drag = { el, ghost, dx: Math.min(x - r.left, 40), dy: y - r.top, kind: el.dataset.kind, id: el.dataset.id,
             target: null, time: undefined, x, y, flip: null };
    follow(x, y);
    drag.tick = setInterval(autoScroll, 16);
  }

  function follow(x, y) {
    drag.x = x; drag.y = y;
    drag.ghost.style.left = (x - drag.dx) + 'px';
    drag.ghost.style.top = (y - drag.dy) + 'px';
    const under = document.elementFromPoint(x, y);
    let target = under && under.closest('.drop-target, .tray');
    if (target && drag.kind === 'workout' && target.classList.contains('tray')) target = null;   // workouts keep a date
    if (target !== drag.target) {
      if (drag.target) drag.target.classList.remove('over');
      drag.target = target;
      if (target && !target.dataset.grid) target.classList.add('over');
    }
    // Over the hour grid, a todo gets the time under the finger (a workout just the day).
    const line = document.querySelector('.drop');
    drag.time = undefined;
    if (target && target.dataset.grid && drag.kind === 'todo') {
      // The ghost's top edge is where the item would start.
      drag.time = slotTime(y - drag.dy - target.getBoundingClientRect().top);
      const el = line || target.appendChild(Object.assign(document.createElement('div'), { className: 'drop' }));
      el.style.top = (toMin(drag.time) - START_H * 60) * PX_PER_MIN + 'px';
      el.innerHTML = `<span>${drag.time}</span>`;
    } else if (line) line.remove();
    if (target && target.classList.contains('anytime')) drag.time = '';
    if (target && target.dataset.grid && drag.kind === 'workout') target.classList.add('over');
    // Hovering ‹ or › flips the week or day after a moment.
    const btn = under && under.closest('#prevBtn, #nextBtn');
    if (!btn) { if (drag.flip) drag.flip.btn.classList.remove('hot'); drag.flip = null; }
    else if (!drag.flip || drag.flip.btn !== btn) { drag.flip = { btn, at: performance.now() }; btn.classList.add('hot'); }
  }

  // Near the top or bottom of the screen the page scrolls; a held ‹ › flips the week or day.
  function autoScroll() {
    const h = window.innerHeight;
    const headerBottom = document.querySelector('header').getBoundingClientRect().bottom;
    let scrolled = false;
    if (drag.y < headerBottom + EDGE && drag.y > headerBottom) { window.scrollBy(0, -12); scrolled = true; }
    else if (drag.y > h - EDGE) { window.scrollBy(0, 12); scrolled = true; }
    if (scrolled) follow(drag.x, drag.y);   // what's under the finger changed
    if (drag.flip && performance.now() - drag.flip.at > FLIP_MS) {
      focus = addDays(focus, (drag.flip.btn.id === 'prevBtn' ? -1 : 1) * (view === 'week' ? 7 : 1));
      drag.flip.at = performance.now();
      redrawWhileDragging();
    }
  }

  // A redraw replaces the cards; keep the lifted look on the one being dragged.
  function redrawWhileDragging() {
    draw();
    drag.target = null;
    const el = document.querySelector(`.item[data-kind="${drag.kind}"][data-id="${CSS.escape(drag.id)}"]`);
    if (el) el.classList.add('lifted');
    follow(drag.x, drag.y);
  }

  function endDrag(drop) {
    const d = drag;
    drag = null;
    clearInterval(d.tick);
    d.ghost.remove();
    document.body.classList.remove('dragging');
    if (d.flip) d.flip.btn.classList.remove('hot');
    if (d.target) d.target.classList.remove('over');
    document.querySelectorAll('.drop').forEach(e => e.remove());
    document.querySelectorAll('.item.lifted').forEach(e => e.classList.remove('lifted'));
    if (drop && d.target) move(d.kind, d.id, d.target.dataset.day, d.time);
  }

  // ---- nav ---------------------------------------------------------------
  const step = () => view === 'week' ? 7 : 1;
  $('prevBtn').addEventListener('click', () => { focus = addDays(focus, -step()); draw(view === 'day'); });
  $('nextBtn').addEventListener('click', () => { focus = addDays(focus, step()); draw(view === 'day'); });
  $('todayBtn').addEventListener('click', () => { focus = localDay(new Date()); draw(view === 'day'); });
  $('weekView').addEventListener('click', () => show('week'));
  $('dayView').addEventListener('click', () => show('day'));

  // ---- sign-in and live data ---------------------------------------------
  function listen() {
    const { onSnapshot } = window.__fs;
    const fail = what => err => note(`Couldn't load ${what}: ` + (err.code || err.message), 'err');
    let first = 2;   // scroll the day view once both lists have arrived
    const redraw = () => { if (drag) redrawWhileDragging(); else draw(view === 'day' && --first === 0); };
    unsub.push(onSnapshot(window.__auth.userCol('workouts'), snap => {
      workouts = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
      redraw();
    }, fail('workouts')));
    unsub.push(onSnapshot(window.__auth.userCol('todos'), snap => {
      todos = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
      redraw();
    }, fail('todos')));
  }

  window.addEventListener('wilo-user', ev => {
    const user = ev.detail;
    $('gate').hidden = !!user;
    $('gateBtn').hidden = !!user;
    $('gateMsg').textContent = 'Sign in to see your calendar.';
    unsub.splice(0).forEach(u => u());
    if (user) listen();
  });
  window.addEventListener('wilo-auth-error', ev => {
    $('gateMsg').textContent = "Couldn't load sign-in: " + (ev.detail && ev.detail.message || ev.detail) + '. Check your connection and reload.';
  });
  $('gateBtn').addEventListener('click', async () => {
    try { await window.__auth.signIn(); }
    catch (err) { $('gateMsg').textContent = 'Sign-in failed: ' + (err.code || err.message); }
  });

  draw();
</script>
</body>
</html>

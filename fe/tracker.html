<!DOCTYPE html>
<!--
  WILO tracker - v3  (2026-09-08)
  squat-logger v2 + program loading.

  - Loads a WILO program JSON (Program > Session > Blocks > Exercises)
  - Seed program embedded below so this works as one offline file;
    the Load button reads any wilo-program-seed.json from Files
  - Target column shows the plan; you log actual against it
  - Time-based exercises (dead hang) log secs instead of reps
  - Exercises with a fallback (Smith OHP 50% ROM) get a Swap button
  - Everything from v2 kept: photos, autosave, JSON sheet, Finish export

  - Tap the photo slot under any exercise note to pick from the camera roll
  - Images downscaled to 640px and stored as blobs in IndexedDB (not localStorage)
  - Each exercise carries a stable pid key; renaming/reordering keeps its photo
  - Object URLs revoked and re-minted per draw, so no leaks
  - v1 drafts restore cleanly: missing photo keys are backfilled

  Fixes after first device test (the blank slot + "Script error." pair):
  - Slot is a button that calls input.click(), not a <label> wrapping a
    hidden input. iOS Safari would not open the picker for display:none.
  - IndexedDB is feature-detected and falls back to localStorage data URLs.
    A sandboxed iframe gives an opaque origin and indexedDB.open() throws
    SecurityError there; the unhandled rejection was the "Script error."
  - A broken image can no longer collapse the slot to a 1px hairline.
  - downscale() always resolves and can never hang on a stalled decode.
  - Failures print to the on-screen status line and hold for 8s instead of
    being wiped by the next autosave tick.
-->

<html lang="en">
<head>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="WILO">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta charset="utf-8">
<title>WILO</title>
<style>
  :root {
    --bg: #000;
    --panel: #0e0e0f;
    --field: #1c1c1e;
    --line: #262628;
    --text: #f2f2f7;
    --dim: #7c7c82;
    --accent: #0a84ff;
    --done: #1f4a2c;
    --done-line: #34c759;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; width: 100%; max-width: 100%; overflow-x: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font: 400 17px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
    position: fixed; top: 0; left: 0; right: 0;
    height: 100dvh;
    height: var(--vvh, 100dvh);
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--line); flex: none;
  }
.saved { margin: 2px 0 0; font-size: 12px; color: var(--dim); }
  .saved.ok { color: var(--done-line); }
  .finish {
    background: var(--accent); color: #fff; border: 0;
    padding: 8px 20px; border-radius: 999px; font-size: 16px; font-weight: 500;
  }

  .hbtns { display: flex; align-items: center; gap: 8px; }
  .ghost {
    background: var(--field); color: var(--text); border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 999px; font-family: inherit; font-size: 15px;
  }
  .block-head {
    padding: 16px 16px 6px; border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .block-head h2 { margin: 0; font-size: 15px; font-weight: 600; color: var(--dim); }
  .block-head p { margin: 4px 0 0; font-size: 14px; color: #5c5c62; }
  .swap {
    background: none; border: 1px solid var(--line); border-radius: 999px;
    color: var(--dim); font-family: inherit; font-size: 13px; padding: 5px 12px;
    margin-top: 10px;
  }
  .swap.on { color: var(--done-line); border-color: var(--done-line); }
  .stats {
    display: flex; padding: 14px 16px; gap: 32px;
    border-bottom: 1px solid var(--line); flex: none;
  }
  .stat span { display: block; color: var(--dim); font-size: 14px; margin-bottom: 3px; }
  .stat strong { font-size: 21px; font-weight: 600; }

  /* scrolling exercise list */
  .list { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: 90px; }

  .exercise { padding: 18px 16px 10px; border-bottom: 1px solid var(--line); }
  .exercise, .ex-head { min-width: 0; max-width: 100%; }
  .ex-head { display: flex; align-items: flex-start; gap: 8px; }
  .ex-name {
    flex: 1 1 auto; min-width: 0; background: transparent; border: 0; padding: 0 0 4px;
    color: var(--accent); font-family: inherit; font-size: 20px; font-weight: 600; line-height: 1.25;
  }
  .ex-note {
    display: block; width: 100%; min-width: 0; max-width: 100%;
    background: transparent; border: 0; padding: 0 0 14px;
    color: var(--dim); font-family: inherit; font-size: 16px; font-weight: 400; line-height: 1.3;
  }
  .ex-name:focus, .ex-note:focus { outline: none; box-shadow: 0 1px 0 var(--accent); }
  .sess-name-input {
    background: transparent; border: 0; padding: 0; width: 100%;
    color: inherit; font-family: inherit; font-size: 28px; font-weight: 700; line-height: 1.2;
  }
  .sess-name-input:focus { outline: none; box-shadow: 0 1px 0 var(--accent); }
  .ex-name::placeholder { color: #2d5c8a; }
  .ex-note::placeholder { color: #4a4a4f; }
  .kill {
    background: none; border: 0; color: var(--dim);
    font-size: 20px; line-height: 1; padding: 2px 4px;
  }

  table { width: 100%; max-width: 100%; border-collapse: collapse; table-layout: fixed; }
  th:first-child, td:first-child { width: 48px; }
  th:nth-child(3), th:nth-child(4) { width: 84px; }
  th:last-child, td:last-child { width: 52px; }
  .prev { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  th { color: var(--dim); font-size: 13px; font-weight: 500; padding-bottom: 10px; text-align: center; }
  th:nth-child(2) { text-align: left; }
  td { padding: 4px 0; text-align: center; }

  .setno {
    width: 34px; height: 34px; margin: 0 auto; background: var(--field);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 600;
  }
  .prev { color: var(--dim); font-size: 15px; text-align: left; }

  input[type=number], input[type=text] {
    width: 76px; height: 38px; background: var(--field); border: 0; border-radius: 8px;
    color: var(--text); font-family: inherit; font-size: 17px; font-weight: 500; text-align: center;
    appearance: textfield; -moz-appearance: textfield;
  }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .check { width: 44px; height: 36px; border: 0; border-radius: 8px; background: var(--field); color: var(--dim); font-size: 17px; }
  tr.done .check { background: var(--done); color: var(--done-line); }
  tr.done input[type=number], tr.done input[type=text] { background: var(--done); }

  .photo-row { margin: 0 0 14px; }
  .photo-slot {
    display: inline-flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    min-width: 96px; height: 72px; padding: 0 14px;
    background: var(--field); border: 1px dashed var(--line); border-radius: 10px;
    color: var(--dim); font-family: inherit; font-size: 15px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  /* min-width stays put even with a photo: a broken image must never
     collapse the slot to a hairline. */
  .photo-slot.has-photo { border-style: solid; padding: 0; }
  .photo-slot img { height: 72px; width: auto; max-width: 160px; object-fit: cover; display: block; }
  .photo-slot.has-photo .photo-hint { display: none; }
  /* Visually hidden, but still laid out — iOS Safari will not open the
     picker for an input that is display:none. */
  .photo-input {
    position: absolute; width: 1px; height: 1px;
    opacity: 0; pointer-events: none; border: 0; padding: 0; margin: -1px;
  }
  .photo-x {
    position: absolute; top: 3px; right: 3px;
    width: 22px; height: 22px; border: 0; border-radius: 50%;
    background: rgba(0,0,0,.65); color: #fff; font-size: 15px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .add, .add-ex {
    width: 100%; padding: 13px; background: var(--field); border: 0;
    border-radius: 10px; color: var(--text); font-family: inherit; font-size: 16px; font-weight: 400;
  }
  .add { margin-top: 14px; }
  .add-ex-wrap { padding: 18px 16px; }
  .add-ex { width: 100%; color: var(--accent); }

  /* JSON sheet */
  .json-btn {
    position: fixed; right: 16px; bottom: 20px; z-index: 3;
    background: var(--field); border: 1px solid var(--line); color: var(--text);
    padding: 11px 18px; border-radius: 999px;
    font: 500 15px ui-monospace, SFMono-Regular, Menlo, monospace;
    box-shadow: 0 4px 16px rgba(0,0,0,.6);
  }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
    background: var(--panel); border-top: 1px solid var(--line);
    height: 55vh; display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform .28s cubic-bezier(.3,.8,.4,1);
  }
  .sheet.open { transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line); flex: none;
  }
  .sheet-head span { font-size: 13px; color: var(--dim); }
  .sheet-head .last { color: var(--accent); font-family: ui-monospace, Menlo, monospace; }
  .sheet-head button { background: none; border: 0; color: var(--accent); font-family: inherit; font-size: 16px; }
  pre {
    flex: 1; overflow: auto; margin: 0; padding: 12px 16px;
    font: 400 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #a8d5ff; white-space: pre-wrap;
  }
</style>
</head>
<body>

<header>
  <div>
    <div style="font-size:11px;color:#4caf50;margin-bottom:4px;">v2026-09-11-002</div>
    <input id="sessName" class="sess-name-input" value="WILO">
    <p class="saved" id="saved">Not saved yet</p>
  </div>
  <div class="hbtns">
    <button class="ghost" id="resetBtn">Reset</button>
    <button class="ghost" id="loadBtn">Load</button>
    <button class="finish" id="finish">Finish</button>
  </div>
  <input type="file" accept="application/json,.json" id="progFile" class="photo-input">
</header>

<div class="stats">
  <div class="stat"><span>Volume</span><strong id="volume">0 lbs</strong></div>
  <div class="stat"><span>Sets</span><strong id="setcount">0</strong></div>
</div>

<div class="list" id="list"></div>

<button class="json-btn" id="jsonBtn">{ }</button>

<div class="sheet" id="sheet">
  <div class="sheet-head">
    <span class="last" id="last">state</span>
    <button id="closeSheet">Close</button>
  </div>
  <pre id="state"></pre>
</div>

<script>
  let nextId = 1;
  const uid = () => 'ex' + (nextId++) + '-' + Math.random().toString(36).slice(2, 7);

  // ---- embedded seed program ---------------------------------------
  // Same shape as wilo-program-seed.json. Load replaces this at runtime.
  const SEED = {
    "program": { "id": "prog_2026_09", "name": "Shoulder rotation + lower" },
    "sessions": [{
      "id": "sess_shoulder_lower_a",
      "name": "Shoulder rotation + lower fun",
      "blocks": [
        { "id": "blk_1", "name": "Part One \u2014 shoulder upward rotation",
          "notes": "Low load, high attention. Nothing here should hurt.",
          "exercises": [
            { "id": "ex_dead_hang", "name": "Dead hang", "sets": 3,
              "target": { "duration_sec": [20, 30] },
              "cue": "Passive. Let the shoulders come to your ears." },
            { "id": "ex_scap_pullup", "name": "Scapular pull-up", "sets": 3,
              "target": { "reps": 8 },
              "cue": "Shoulders down and back, elbows straight, slow." },
            { "id": "ex_serratus_shrug", "name": "Serratus shrug", "sets": 3,
              "target": { "reps": 10 },
              "cue": "Protract and push, don't row." },
            { "id": "ex_sword_raise", "name": "Sword raise", "sets": 2,
              "target": { "reps": 12, "per_side": true }, "start_weight_lbs": 10,
              "cue": "Hip to overhead on the diagonal, thumb leading. Light." },
            { "id": "ex_smith_ohp", "name": "Smith overhead press", "sets": 3,
              "target": { "reps": 8 },
              "cue": "Stop at pain, log it, retry next session.",
              "fallback": { "name": "Smith OHP \u2014 50% ROM + 1s hold", "sets": 3,
                            "target": { "reps": 8 },
                            "cue": "Half range, one-second hold at the top." } },
            { "id": "ex_landmine_press", "name": "Landmine press", "sets": 2,
              "target": { "reps": 10, "per_side": true },
              "cue": "Elbow under the line of push." }
          ] },
        { "id": "blk_2", "name": "Part Two \u2014 lower fun",
          "notes": "Hamstrings and glutes. Not knee-aggressive, not shoulder-dependent.",
          "exercises": [
            { "id": "ex_lying_leg_curl", "name": "Lying leg curl (machine)", "sets": 4,
              "target": { "reps": 10 }, "start_weight_lbs": 90,
              "cue": "Pointed toes. Weak side first, single-leg opening set." },
            { "id": "ex_leg_extension", "name": "Leg extension (machine)", "sets": 3,
              "target": { "reps": 12 }, "start_weight_lbs": 60,
              "cue": "Light, pump-focused. One leg first, finish with two." },
            { "id": "ex_bstance_rdl", "name": "B-stance RDL", "sets": 3,
              "target": { "reps": 8, "per_side": true }, "start_weight_lbs": 30,
              "cue": "Contralateral load." },
            { "id": "ex_cranes", "name": "Cranes", "sets": 3,
              "target": { "reps": 10 }, "load": "loaded",
              "cue": "Start with both legs." }
          ] }
      ]
    }]
  };

  // ---- program -> logging state -------------------------------------
  function targetLabel(t, load) {
    if (!t) return load || '\u2014';
    if (t.duration_sec) return t.duration_sec[0] + '\u2013' + t.duration_sec[1] + ' sec';
    let s = t.reps + (t.unit === 'round' ? ' round' : ' reps');
    if (t.per_side) s += '/side';
    if (load) s += ' \u00b7 ' + load;
    return s;
  }

  function makeExercise(def, blockId) {
    const timed = !!(def.target && def.target.duration_sec);
    const tgt = targetLabel(def.target, def.load);
    const defaultLbs = def.start_weight_lbs || 0;
    const defaultReps = timed ? (def.target.duration_sec[0])
                               : (def.target && def.target.reps ? def.target.reps : 10);
    // def.sets can be a number (program) or an array of logged sets (export)
    const sets = Array.isArray(def.sets)
      ? def.sets.map(s => ({ prev: tgt, lbs: s.lbs ?? defaultLbs, reps: s.reps ?? defaultReps, done: s.done ?? false, custom: s.custom || null }))
      : Array.from({ length: def.sets || 1 }, () => ({ prev: tgt, lbs: defaultLbs, reps: defaultReps, done: false, custom: null }));
    return {
      pid: def.id || uid(),
      exId: def.id || uid(),
      blockId,
      timed,
      name: def.name,
      custom_name: def.custom_name || null,
      note: def.cue || '',
      target: tgt,
      fallback: def.fallback || null,
      swapped: false,
      original: null,
      sets
    };
  }

  // The program the session came from, kept so Reset can rebuild from it.
  let loadedProgram = SEED;

  function loadProgram(doc) {
    const sess = (doc.sessions && doc.sessions[0]) || null;
    if (!sess) throw new Error('no session in file');
    loadedProgram = doc;
    state.sessionId = sess.id;
    state.sessionName = sess.name;
    state.blocks = (sess.blocks || []).map(b => ({ id: b.id, name: b.name, notes: b.notes || '' }));
    state.exercises = [];
    (sess.blocks || []).forEach(b => {
      (b.exercises || []).forEach(def => state.exercises.push(makeExercise(def, b.id)));
    });
    document.getElementById('sessName').value = sess.name || 'WILO';
  }

  const state = { sessionId: null, sessionName: '', blocks: [], exercises: [] };

  const list = document.getElementById('list');
  const sheet = document.getElementById('sheet');
  let last = 'state';

  function draw() {
    list.innerHTML = '';
    let currentBlock = null;
    state.exercises.forEach((ex, e) => {
      if (ex.blockId && ex.blockId !== currentBlock) {
        currentBlock = ex.blockId;
        const b = state.blocks.find(x => x.id === ex.blockId);
        if (b) {
          const h = document.createElement('div');
          h.className = 'block-head';
          h.innerHTML = `<h2>${esc(b.name)}</h2>` + (b.notes ? `<p>${esc(b.notes)}</p>` : '');
          list.appendChild(h);
        }
      }
      const unit = ex.timed ? 'secs' : 'reps';
      const el = document.createElement('div');
      el.className = 'exercise';
      el.innerHTML = `
        <div class="ex-head">
          <input class="ex-name" value="${esc(ex.name)}" placeholder="Exercise name"
                 data-e="${e}" data-k="name">
          <button class="kill" data-kill="${e}">&times;</button>
        </div>
        <input class="ex-note" value="${esc(ex.note)}" placeholder="Add a note"
               data-e="${e}" data-k="note">
        <input class="ex-note" value="${esc(ex.custom_name || '')}" placeholder="Custom field name (e.g. incline height)"
               data-e="${e}" data-k="custom_name">
        <div class="photo-row">
          <button type="button" class="photo-slot" data-photo-for="${ex.pid}">
            <span class="photo-hint">+ Photo</span>
          </button>
          <input type="file" accept="image/*" class="photo-input" data-pick="${ex.pid}">
        </div>
        <table>
          <thead><tr><th>Set</th><th>Target</th>${ex.timed ? '' : '<th>lbs</th>'}<th>${unit}</th>${ex.custom_name ? `<th>${esc(ex.custom_name)}</th>` : ''}<th>&check;</th></tr></thead>
          <tbody>${ex.sets.map((s, i) => `
            <tr class="${s.done ? 'done' : ''}">
              <td><div class="setno">${i + 1}</div></td>
              <td class="prev">${esc(s.prev)}</td>
              ${ex.timed ? '' : `<td><input type="number" inputmode="numeric" value="${s.lbs}" data-e="${e}" data-i="${i}" data-k="lbs"></td>`}
              <td><input type="number" inputmode="numeric" value="${s.reps}" data-e="${e}" data-i="${i}" data-k="reps"></td>
              ${ex.custom_name ? `<td><input type="text" value="${esc(s.custom || '')}" data-e="${e}" data-i="${i}" data-k="custom"></td>` : ''}
              <td><button class="check" data-e="${e}" data-i="${i}">&check;</button></td>
            </tr>`).join('')}</tbody>
        </table>
        <button class="add" data-add="${e}">+ Add Set</button>
        ${ex.fallback || ex.swapped
          ? `<button class="swap ${ex.swapped ? 'on' : ''}" data-swap="${e}">${ex.swapped ? '\u21a9 Back to full range' : '\u21c4 Swap to easier version'}</button>`
          : ''}`;
      list.appendChild(el);
    });
    const wrap = document.createElement('div');
    wrap.className = 'add-ex-wrap';
    wrap.innerHTML = '<button class="add-ex" id="addEx">+ Add Exercise</button>';
    list.appendChild(wrap);
    sync();
    paintPhotos();
  }

  function esc(s) { return String(s).replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

  function sync() {
    const done = state.exercises.flatMap(x => x.sets).filter(s => s.done);
    // Timed work has no meaningful tonnage - a 30-second hang isn't 30 reps.
    const vol = state.exercises
      .filter(x => !x.timed)
      .flatMap(x => x.sets)
      .filter(s => s.done)
      .reduce((t, s) => t + s.lbs * s.reps, 0);
    document.getElementById('volume').textContent = vol.toLocaleString() + ' lbs';
    document.getElementById('setcount').textContent = done.length;
    document.getElementById('state').textContent = JSON.stringify(state, null, 2);
    document.getElementById('last').textContent = last;
    if (typeof queueSave === 'function') queueSave();
  }

  list.addEventListener('blur', e => {
    if (e.target.dataset.k === 'custom_name') draw();
  }, true);

  list.addEventListener('input', e => {
    const el = e.target;
    if (el.tagName !== 'INPUT') return;
    const x = +el.dataset.e, k = el.dataset.k;
    if (el.dataset.i !== undefined) {
      const i = +el.dataset.i;
      state.exercises[x].sets[i][k] = k === 'custom' ? el.value : (el.value === '' ? 0 : +el.value);
      last = `exercises[${x}].sets[${i}].${k} = ${state.exercises[x].sets[i][k]}`;
      sync();
    } else {
      state.exercises[x][k] = el.value;
      last = `exercises[${x}].${k}`;
      sync();
    }
  });

  list.addEventListener('click', e => {
    const chk = e.target.closest('.check');
    if (chk) {
      const x = +chk.dataset.e, i = +chk.dataset.i;
      const s = state.exercises[x].sets[i];
      s.done = !s.done;
      chk.closest('tr').classList.toggle('done', s.done);
      last = `exercises[${x}].sets[${i}].done = ${s.done}`;
      return sync();
    }
    const add = e.target.closest('[data-add]');
    if (add) {
      const x = +add.dataset.add;
      const sets = state.exercises[x].sets;
      const p = sets[sets.length - 1];
      sets.push({ prev: "\u2014", lbs: p ? p.lbs : 45, reps: p ? p.reps : 5, done: false, custom: null });
      last = `exercises[${x}].sets.push()`;
      return draw();
    }
    const sw = e.target.closest('[data-swap]');
    if (sw) {
      const x = +sw.dataset.swap;
      const ex = state.exercises[x];
      if (!ex.swapped && ex.fallback) {
        // Keep the original so coming back is one tap, not a reload.
        ex.original = { name: ex.name, note: ex.note, target: ex.target, sets: ex.sets };
        const f = ex.fallback;
        ex.name = f.name;
        ex.note = f.cue || ex.note;
        ex.target = targetLabel(f.target, f.load);
        ex.sets = Array.from({ length: f.sets || ex.sets.length },
          () => ({ prev: ex.target, lbs: 0, reps: (f.target && f.target.reps) || 8, done: false }));
        ex.swapped = true;
      } else if (ex.original) {
        Object.assign(ex, ex.original);
        ex.swapped = false;
        ex.original = null;
      }
      last = `exercises[${x}].swapped = ${ex.swapped}`;
      return draw();
    }
    const kill = e.target.closest('[data-kill]');
    if (kill) {
      const x = +kill.dataset.kill;
      last = `exercises.splice(${x}, 1)`;
      state.exercises.splice(x, 1);
      return draw();
    }
    if (e.target.id === 'addEx') {
      const lastEx = state.exercises[state.exercises.length - 1];
      state.exercises.push({
        pid: uid(), exId: uid(), blockId: lastEx ? lastEx.blockId : null,
        timed: false, name: "", note: "", target: "\u2014",
        fallback: null, swapped: false, original: null,
        sets: [{ prev: "\u2014", lbs: 45, reps: 5, done: false, custom: null }]
      });
      last = `exercises.push() \u2192 ${state.exercises.length}`;
      draw();
      const inputs = list.querySelectorAll('.ex-name');
      inputs[inputs.length - 1].focus();
    }
  });

  // Photos are stored downscaled: IndexedDB has room for the originals,
  // but a 4MB shot to fill a 160px slot is wasted read time on every draw.
  // Always resolves — with the shrunk blob if it can, otherwise the
  // original. Never rejects, never hangs: a stalled decode used to leave
  // the await pending forever with nothing on screen to say so.
  function downscale(file, max = 640) {
    return new Promise((resolve) => {
      let settled = false;
      const url = URL.createObjectURL(file);
      const finish = (out) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        URL.revokeObjectURL(url);
        resolve(out || file);
      };
      const timer = setTimeout(() => finish(file), 5000);
      const img = new Image();
      img.onload = () => {
        try {
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          const ctx = c.getContext('2d');
          if (!ctx || !c.toBlob) return finish(file);
          ctx.drawImage(img, 0, 0, w, h);
          c.toBlob(b => finish(b), 'image/jpeg', 0.82);
        } catch { finish(file); }
      };
      img.onerror = () => finish(file);
      img.src = url;
    });
  }

  list.addEventListener('change', async e => {
    const input = e.target.closest('[data-pick]');
    if (!input || !input.files || !input.files[0]) return;
    const key = input.dataset.pick;
    try {
      const blob = await downscale(input.files[0]);
      await putPhoto(key, blob);
      last = 'photo saved: ' + key + ' (' + backend + ')';
      await paintPhotos();
      sync();
    } catch (err) {
      note("Photo failed: " + (err && err.name ? err.name : err));
    }
    input.value = '';   // so picking the same file twice still fires change
  });

  list.addEventListener('click', async e => {
    // Delete takes priority — the × sits inside the slot button.
    const x = e.target.closest('[data-delphoto]');
    if (x) {
      e.preventDefault();
      e.stopPropagation();
      const key = x.dataset.delphoto;
      try { await delPhoto(key); } catch {}
      showHint(x.closest('.photo-slot'));
      last = 'photo removed: ' + key;
      return sync();
    }
    // Tapping the slot opens the picker. Driven explicitly rather than by
    // a <label>, which iOS Safari handles inconsistently.
    const slot = e.target.closest('[data-photo-for]');
    if (slot) {
      e.preventDefault();
      const input = slot.parentElement.querySelector('[data-pick]');
      if (input) input.click();
    }
  });

  document.getElementById('jsonBtn').addEventListener('click', () => sheet.classList.toggle('open'));
  document.getElementById('closeSheet').addEventListener('click', () => sheet.classList.remove('open'));

  // Lock the app to the visual viewport: the keyboard shrinks the scroll
  // area instead of displacing the whole layout.
  const vv = window.visualViewport;
  function lockViewport() {
    const h = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty('--vvh', h + 'px');
    window.scrollTo(0, 0);
  }
  if (vv) {
    vv.addEventListener('resize', lockViewport);
    vv.addEventListener('scroll', lockViewport);
  }
  window.addEventListener('resize', lockViewport);
  lockViewport();

  // iOS still nudges the document on focus; snap it back on the next frame.
  document.addEventListener('focusin', () => {
    requestAnimationFrame(() => { window.scrollTo(0, 0); lockViewport(); });
  });

  // ---- photo storage (IndexedDB) ------------------------------------
  // localStorage holds the workout JSON; photos are blobs and go here,
  // where there's room for them.
  // Two backends. IndexedDB when the page has a real origin; a
  // localStorage data-URL shim when it doesn't. Sandboxed iframes (the
  // artifact viewer, some in-app browsers) hand you an opaque origin, and
  // indexedDB.open() throws SecurityError there. That throw was the source
  // of the bare "Script error." messages: dbp became a rejected promise
  // with nothing attached to it yet.
  const DB_NAME = 'workout-photos', STORE = 'photos';
  const LS_PREFIX = 'workout-photo:';
  let dbp = null, backend = 'unknown';

  function db() {
    if (dbp) return dbp;
    dbp = new Promise((resolve, reject) => {
      let req;
      try {
        if (!self.indexedDB) throw new Error('no indexedDB');
        req = indexedDB.open(DB_NAME, 1);
      } catch (err) { reject(err); return; }
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains(STORE)) req.result.createObjectStore(STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('indexedDB open failed'));
      req.onblocked = () => reject(new Error('indexedDB blocked'));
    });
    // Attach a catch immediately so a rejection is never "unhandled".
    dbp.catch(() => {});
    return dbp;
  }

  // Resolves to true once we know IndexedDB is usable, false if we're
  // falling back. Checked once, cached.
  let idbOk = null;
  async function useIdb() {
    if (idbOk !== null) return idbOk;
    try { await db(); idbOk = true; backend = 'IndexedDB'; }
    catch { idbOk = false; backend = 'localStorage'; }
    return idbOk;
  }

  function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(r.error || new Error('read failed'));
      r.readAsDataURL(blob);
    });
  }

  async function putPhoto(key, blob) {
    if (await useIdb()) {
      const d = await db();
      return new Promise((resolve, reject) => {
        const tx = d.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(blob, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error || new Error('aborted'));
      });
    }
    // Fallback: data URL in localStorage. Smaller cap, so downscale harder.
    const small = await downscale(blob, 320);
    localStorage.setItem(LS_PREFIX + key, await blobToDataUrl(small));
  }

  // Returns a string usable as an <img src>, or null.
  async function getPhotoSrc(key) {
    if (await useIdb()) {
      const d = await db();
      const blob = await new Promise((resolve, reject) => {
        const tx = d.transaction(STORE, 'readonly');
        const req = tx.objectStore(STORE).get(key);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
      if (!blob) return null;
      const url = URL.createObjectURL(blob);
      urlCache[key] = url;
      return url;
    }
    return localStorage.getItem(LS_PREFIX + key) || null;
  }

  async function delPhoto(key) {
    if (await useIdb()) {
      const d = await db();
      return new Promise((resolve, reject) => {
        const tx = d.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }
    localStorage.removeItem(LS_PREFIX + key);
  }

  // Object URLs are revoked and re-minted on each draw so we don't leak.
  let urlCache = {};
  function clearUrls() {
    Object.values(urlCache).forEach(u => URL.revokeObjectURL(u));
    urlCache = {};
  }

  function showHint(el) {
    el.classList.remove('has-photo');
    el.innerHTML = '<span class="photo-hint">+ Photo</span>';
  }

  async function paintPhotos() {
    clearUrls();
    for (const el of document.querySelectorAll('[data-photo-for]')) {
      const key = el.dataset.photoFor;
      let src = null;
      try { src = await getPhotoSrc(key); } catch { src = null; }
      if (!src) { showHint(el); continue; }

      // Built as nodes, not innerHTML, so onerror is attached before the
      // load can fail. A dead src used to leave a 1px-wide slot — the
      // hairline in the screenshot.
      const img = document.createElement('img');
      img.alt = '';
      img.onerror = () => showHint(el);
      const x = document.createElement('button');
      x.type = 'button';
      x.className = 'photo-x';
      x.dataset.delphoto = key;
      x.innerHTML = '&times;';
      el.innerHTML = '';
      el.appendChild(img);
      el.appendChild(x);
      el.classList.add('has-photo');
      img.src = src;
    }
  }

  // ---- persistence -------------------------------------------------
  const KEY = 'workout-log-draft';
  const savedEl = document.getElementById('saved');

  // One place to surface a problem. The status line is already on screen,
  // which beats a console you can't open on a phone.
  // Errors hold the line for a few seconds. Without this the autosave tick
  // (400ms) overwrites the message with "Saved 3:57 PM" before it can be read.
  let noteUntil = 0;
  function note(msg) {
    savedEl.textContent = msg;
    savedEl.classList.remove('ok');
    noteUntil = Date.now() + 8000;
  }
  window.addEventListener('error', ev => {
    note('Error: ' + (ev.message || 'unknown') + (ev.lineno ? ' @' + ev.lineno : ''));
  });
  window.addEventListener('unhandledrejection', ev => {
    const r = ev.reason;
    note('Error: ' + (r && (r.name || r.message) ? (r.name || r.message) : r));
  });
  let saveTimer = null;

  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ savedAt: Date.now(), state }));
      if (Date.now() < noteUntil) return;   // don't stomp a visible error
      const t = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
      savedEl.textContent = 'Saved ' + t;
      savedEl.classList.add('ok');
    } catch (err) {
      note("Couldn't save to this browser");
    }
  }

  function queueSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 400);
  }

  function restore() {
    let raw;
    try { raw = localStorage.getItem(KEY); } catch (err) { return; }
    if (!raw) return;
    try {
      const saved = JSON.parse(raw);
      if (!saved.state || !Array.isArray(saved.state.exercises)) return;
      state.exercises = saved.state.exercises;
      state.blocks = saved.state.blocks || [];
      state.sessionId = saved.state.sessionId || null;
      state.sessionName = saved.state.sessionName || '';
      if (state.sessionName) document.getElementById('sessName').value = state.sessionName;
      // Older drafts predate these fields; backfill so draw() doesn't trip.
      state.exercises.forEach(ex => {
        if (!ex.pid) ex.pid = uid();
        if (ex.timed === undefined) ex.timed = false;
        if (ex.target === undefined) ex.target = '\u2014';
        if (ex.swapped === undefined) ex.swapped = false;
      });
      const t = new Date(saved.savedAt).toLocaleString([], {
        month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
      });
      savedEl.textContent = 'Restored from ' + t;
      savedEl.classList.add('ok');
    } catch (err) { /* corrupt draft: start fresh */ }
  }

  function download() {
    const stamp = new Date();
    const pad = n => String(n).padStart(2, '0');
    const slug = `${state.sessionName || ''}-${state.sessionId || 'workout'}`.replace(/[^a-z0-9_-]/gi, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
    const name = `${stamp.getFullYear()}-${pad(stamp.getMonth() + 1)}-${pad(stamp.getDate())}` +
                 `-${pad(stamp.getHours())}${pad(stamp.getMinutes())}-${slug}.json`;

    // Build a lookup of original exercise defs from the loaded program
    const defById = {};
    ((loadedProgram.sessions || [])[0]?.blocks || []).forEach(b =>
      (b.exercises || []).forEach(def => { defById[def.id] = def; })
    );

    const blocks = state.blocks.map(b => ({
      id: b.id,
      name: b.name,
      notes: b.notes || '',
      exercises: state.exercises
        .filter(ex => ex.blockId === b.id)
        .map(ex => {
          const def = defById[ex.exId] || {};
          return {
            id: ex.exId,
            name: ex.name,
            cue: def.cue || ex.note || '',
            custom_name: ex.custom_name || def.custom_name || null,
            target: def.target || null,
            fallback: def.fallback || null,
            swapped: ex.swapped,
            timed: ex.timed,
            sets: ex.sets.map(s => ({ lbs: s.lbs, reps: s.reps, done: s.done, custom: s.custom || null }))
          };
        })
    }));

    const payload = {
      program: loadedProgram.program || { id: state.sessionId, name: state.sessionName },
      finishedAt: stamp.toISOString(),
      sessions: [{
        id: state.sessionId,
        name: state.sessionName,
        blocks
      }]
    };

    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return name;
  }

  document.getElementById('finish').addEventListener('click', () => {
    persist();
    const name = download();
    savedEl.textContent = 'Downloaded ' + name;
    savedEl.classList.add('ok');
  });

  // ---- program loading ----------------------------------------------
  const progFile = document.getElementById('progFile');
  document.getElementById('sessName').addEventListener('input', e => {
    state.sessionName = e.target.value;
  });

  document.getElementById('loadBtn').addEventListener('click', () => progFile.click());
  progFile.addEventListener('change', async () => {
    const f = progFile.files && progFile.files[0];
    progFile.value = '';
    if (!f) return;
    try {
      const doc = JSON.parse(await f.text());
      loadProgram(doc);
      last = 'loaded ' + (state.sessionId || f.name);
      draw();
      note('Loaded ' + (state.sessionName || f.name));
    } catch (err) {
      note("Couldn't read that file: " + (err && err.message ? err.message : err));
    }
  });

  // ---- reset ---------------------------------------------------------
  // Without this the only way to clear a stale draft is the Files app.
  // Resets to whatever program is currently loaded, so if you loaded a
  // file this session you get that back, not the built-in seed.
  document.getElementById('resetBtn').addEventListener('click', () => {
    const logged = state.exercises.flatMap(x => x.sets).filter(s => s.done).length;
    const msg = logged
      ? `Discard ${logged} logged set${logged === 1 ? '' : 's'} and start this workout over?`
      : 'Reset to the program?';
    if (!confirm(msg)) return;
    try { localStorage.removeItem(KEY); } catch {}
    loadProgram(loadedProgram);
    last = 'reset to ' + (state.sessionId || 'program');
    draw();
    note('Reset to ' + (state.sessionName || 'program'));
  });

  // Boot from the embedded seed, then let any saved draft override it.
  loadProgram(SEED);
  restore();
  draw();
</script>

</body>
</html>

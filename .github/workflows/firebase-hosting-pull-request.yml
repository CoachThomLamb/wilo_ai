name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WILO2_1EE44 }}
          projectId: wilo2-1ee44
          # One fixed preview URL for every PR (#115): register it once in the OAuth web client and sign-in works
          # on every PR. With two PRs open, dev shows the last one pushed. 30d is the max; each deploy resets it.
          channelId: dev
          expires: 30d
